<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="viewport">
<meta name="description" content="单词地下城：应试单词战斗 Roguelike 可玩原型，答对单词即攻击敌人，含连击、技能、词典卡构筑与间隔重复，3 层远征约 11 分钟">
<title>单词地下城 Word Dungeon</title>
<style>
  :root{
    --bg0:#0d1828; --bg1:#16263e; --card:#1c3050; --card2:#22385e;
    --line:#33507a; --txt:#eaf2fc; --mut:#9db4d0;
    --cyan:#38bdf8; --gold:#fbbf24; --green:#34d399; --red:#f87171; --orange:#fb923c;
    --teal:#2dd4bf; --purple:#c084fc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #1b3257 0%, var(--bg1) 45%, var(--bg0) 100%);
    color:var(--txt); min-height:100vh; min-height:100dvh;
  }
  #app{width:100%; max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh; padding:14px 14px 26px; position:relative;}
  /* 撑满屏幕：手机视口全宽无留白；宽屏才居中限宽 */
  @media (max-width:600px){ #app{max-width:none;} }
  button{font-family:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  .mut{color:var(--mut);}
  .center{text-align:center;}

  /* 顶部进度 */
  .quick-exit{color:var(--cyan); font-size:13px; font-weight:700; cursor:pointer;}
 .quick-stat{color:var(--mut); font-size:12px; margin-left:auto;}
 .topbar{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .layer-tag{font-size:13px; font-weight:700; color:var(--cyan); white-space:nowrap;}
  .dots{display:flex; gap:5px; flex:1; justify-content:flex-end;}
  .dot{width:11px; height:11px; border-radius:50%; background:#2a4066; border:1px solid var(--line);}
  .dot.done{background:var(--green); border-color:var(--green);}
  .dot.cur{background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px rgba(251,191,36,.7);}

  .card{background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--line);
    border-radius:14px; padding:14px;}

  /* 主界面 */
  .hero{text-align:center; padding:30px 16px 20px;}
  .hero h1{font-size:30px; margin:6px 0 4px; letter-spacing:2px;
    background:linear-gradient(90deg,var(--cyan),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero .sub{color:var(--mut); font-size:14px;}
  .bigbtn{display:block; width:100%; padding:16px; border:none; border-radius:12px; font-size:18px; font-weight:700;
    background:linear-gradient(90deg,#2563eb,#38bdf8); color:#fff; margin:18px 0 10px; box-shadow:0 6px 18px rgba(56,189,248,.35);}
  .bigbtn:active{transform:translateY(1px);}
  .bigbtn-endless{background:linear-gradient(90deg,#7c3aed,#db2777); margin-top:10px;
    box-shadow:0 6px 18px rgba(219,39,119,.35);}
  .bigbtn-endless:active{transform:translateY(1px);}
  .ghostbtn{display:block; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--mut); font-size:14px; margin-top:8px;}
  .bigbtn.ghost{background:linear-gradient(90deg,#0e2a4a,#123a5c); color:var(--gold); border:1px solid rgba(251,191,36,.35); box-shadow:none; padding:13px;}
  .wblist{display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:15px;}
  .wblist:last-child{border-bottom:none;}
  .wbword{font-weight:700; white-space:nowrap;}
  .wpos{color:var(--mut); font-size:12px; font-weight:400;}
  .wbmean{flex:1; color:var(--mut); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wbcnt{font-weight:700; white-space:nowrap;}
  .wbtags{flex-basis:100%; display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
  .wbtag{font-size:10px; color:var(--orange); background:rgba(251,146,60,.12);
    border:1px solid rgba(251,146,60,.3); padding:2px 7px; border-radius:9px;}
  .seg-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px;}
  .seg-grid5{grid-template-columns:repeat(5,1fr);}
  .seg-grid5 .seg{font-size:12.5px; padding:9px 2px;}
  .seg{padding:9px 4px; border-radius:8px; border:1px solid var(--line);
    background:#0e2238; color:var(--mut); font-size:14px; font-weight:600;}
  .seg.on{background:linear-gradient(180deg,#1d4ed8,#2563eb); color:#fff; border-color:#3b82f6;}
  .seg:active{transform:translateY(1px);}
  .progress-row{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; margin:8px 2px;}
  .progress-row span{white-space:nowrap;}
  .bar{height:10px; background:#13243c; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--cyan));}
  .howto{font-size:13px; line-height:1.9; color:var(--mut);}
  .howto b{color:var(--txt);}

  /* 战斗 */
  .enemy{position:relative; text-align:center; padding:10px 14px 9px;}
  .enemy .face{width:44px; height:44px; margin:0 auto 6px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:22px; font-weight:800; color:#fff;
    background:linear-gradient(160deg,#7f1d1d,#b91c1c); border:1px solid #ef4444;}
  .enemy.elite .face{background:linear-gradient(160deg,#9a3412,#ea580c); border-color:var(--orange);}
  .enemy.boss .face{background:linear-gradient(160deg,#4c1d95,#7c2d12); border-color:#a855f7; width:52px; height:52px;}
  .enemy .ename{font-size:16px; font-weight:700;}
  .enemy .warn{font-size:12px; color:var(--red); margin-top:2px;}
  .enemy .mech{font-size:11.5px; color:var(--orange); margin-top:2px;}
  .hpwrap{margin-top:6px;}
  .hpwrap .hpnum{font-size:11.5px; color:var(--mut); margin-top:2px;}
  .bar.enemybar > i{background:linear-gradient(90deg,#ef4444,#f87171);}
  .bar.enemybar.rage{box-shadow:0 0 12px rgba(248,113,113,.6);}

  .combo-line{display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0 2px;}
  .combo-num{font-size:24px; font-weight:800; color:var(--gold); min-width:60px; text-align:center;}
  .combo-lab{font-size:12px; color:var(--mut);}

  .qcard{position:relative; margin-top:6px;}
  .qhead{display:flex; align-items:baseline; justify-content:center; gap:10px; flex-wrap:wrap;}
  .qword{font-size:27px; font-weight:800; letter-spacing:1px;}
  .qpos{font-size:13px; color:var(--cyan);}
  .qprompt{text-align:center; color:var(--mut); font-size:13.5px; margin-top:2px;}
  /* V4.3 题型阶梯进度（识→认→写→拼） */
  .ladder{display:flex; align-items:center; justify-content:center; gap:7px; margin:7px 2px 0;}
  .lad-segs{display:flex; gap:4px;}
  .lad-segs .seg{font-style:normal; font-size:11px; line-height:1; min-width:26px; text-align:center;
    padding:4px 6px; border-radius:6px; border:1px solid var(--line); color:var(--mut);
    background:#101f36; transition:all .18s ease;}
  .lad-segs .seg.on{color:#0b1424; background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#3b82f6; font-weight:700;}
  .lad-segs .seg.cur{box-shadow:0 0 0 2px rgba(251,191,36,.55); transform:translateY(-1px);}
  .lad-lab{font-size:11px; color:var(--gold); font-weight:700;}
  .timer{height:7px; background:#13243c; border-radius:5px; overflow:hidden; margin:8px 2px 2px; border:1px solid var(--line);}
  .timer > i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--orange)); width:100%;}
  .timetxt{font-size:11px; color:var(--mut); text-align:center;}

  .opts{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .opt{padding:10px 14px; border-radius:11px; border:1.5px solid var(--line); background:#1a2d4d;
    color:var(--txt); font-size:15px; text-align:left; display:flex; align-items:center; gap:10px; min-height:46px;}
  .opt .key{width:24px; height:24px; border-radius:6px; background:#2a4066; font-size:12px; display:flex;
    align-items:center; justify-content:center; color:var(--mut); flex:none;}
  .opt:active{background:#22385e;}
  .opt.correct{border-color:var(--green); background:rgba(52,211,153,.18); animation:correctglow .5s ease-out;}
  .opt.wrong{border-color:var(--red); background:rgba(248,113,113,.18); animation:wrongpulse .6s ease-in-out 2;}
  .opt.dim{opacity:.45;}
  @keyframes correctglow{0%{box-shadow:0 0 0 rgba(52,211,153,0)}40%{box-shadow:0 0 18px rgba(52,211,153,.55)}100%{box-shadow:0 0 0 rgba(52,211,153,0)}}
  @keyframes wrongpulse{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .opts.blurring .opt{animation:blur 0.18s steps(2) infinite;}
  @keyframes blur{0%{transform:translateX(-3px); opacity:.5;} 100%{transform:translateX(3px); opacity:.9;}}

  .spellwrap{margin-top:14px;}
  .spellwrap input{width:100%; padding:15px; font-size:20px; border-radius:11px; border:1.5px solid var(--line);
    background:#13243c; color:var(--txt); letter-spacing:1px;}
  .spellwrap input:focus{outline:none; border-color:var(--cyan);}
  .hint-letter{text-align:center; color:var(--gold); font-size:15px; margin-top:8px; letter-spacing:2px;}

  /* V3 字母格子拼写 */
  .spellcells{display:flex; gap:6px; justify-content:center; margin:14px 0 3px; position:relative;}
  .spellcell{height:42px; border-radius:8px; border:2px solid var(--line); background:#13243c;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800;
    color:#fff; text-transform:lowercase; flex:1; max-width:38px;}
  .spellcell.hint{border-color:var(--gold); color:var(--gold);}
  .spellcell.active{border-color:var(--cyan); animation:cellactive 1s ease-in-out infinite;}
  @keyframes cellactive{0%,100%{box-shadow:0 0 6px rgba(56,189,248,.4)}50%{box-shadow:0 0 14px rgba(56,189,248,.75)}}
  .spellcell.full{border-color:#fbbf24; color:#fbbf24; animation:cellfull .9s ease-in-out infinite;}
  @keyframes cellfull{0%,100%{box-shadow:0 0 6px rgba(251,191,36,.4)}50%{box-shadow:0 0 14px rgba(251,191,36,.8)}}
  .spellcell.ok{border-color:var(--green); background:rgba(52,211,153,.18); color:var(--green); animation:cellok .45s ease-out;}
  .spellcell.bad{border-color:var(--red); background:rgba(248,113,113,.18); color:var(--red); animation:cellbad .5s ease-in-out 2;}
  @keyframes cellok{0%{transform:scale(1.18);box-shadow:0 0 16px rgba(52,211,153,.6)}100%{transform:scale(1)}}
  @keyframes cellbad{0%,100%{transform:scale(1)}40%{transform:scale(.86) translateY(3px)}}
  .spellhidden{position:absolute; opacity:0; height:1px; width:1px; left:0; top:0;}
  .spelltap{text-align:center; font-size:13px; color:var(--mut); margin-top:6px;}

  /* V3 快速判断 judge */
  .judge-card{text-align:center;}
  .judge-word{font-size:30px;font-weight:900;color:#fff;margin:4px 0 8px;letter-spacing:1px;}
  .judge-mean{font-size:21px;color:var(--cyan);font-weight:700;margin-bottom:14px;}
  .judge-btns{display:flex;gap:12px;}
  .judgebtn{flex:1;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:#13243c;
    font-size:18px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .12s;}
  .judgebtn .jic{font-size:30px;line-height:1;}
  .judgebtn.yes{border-color:rgba(52,211,153,.5);}
  .judgebtn.yes .jic{color:var(--green);}
  .judgebtn.no{border-color:rgba(248,113,113,.5);}
  .judgebtn.no .jic{color:var(--red);}
  .judgebtn:active{transform:scale(.95);}
  .judgebtn.correct{background:rgba(52,211,153,.2);border-color:var(--green);color:var(--green);}
  .judgebtn.wrong{background:rgba(248,113,113,.2);border-color:var(--red);color:var(--red);animation:wrongpulse .6s ease-in-out 2;}
  .judgebtn.dim{opacity:.45;}

  .playerhud{display:flex; gap:10px; margin-top:10px; align-items:center;}
  .phud{flex:1;}
  .phud .lab{font-size:11px; color:var(--mut); display:flex; justify-content:space-between; margin-bottom:3px;}
  .bar.playerbar > i{background:linear-gradient(90deg,#22c55e,#4ade80);}
  .shieldtag{font-size:12px; color:var(--cyan); white-space:nowrap;}
  .goldtag{font-size:13px; color:var(--gold); white-space:nowrap; font-weight:700;}

  /* 飘字 */
  .floatlayer{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .fdmg{position:absolute; font-size:26px; font-weight:800; color:var(--gold);
    animation:fly 0.9s ease-out forwards; text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .fdmg.crit{color:var(--orange); font-size:34px;}
  .fdmg.rev{color:#ff5a5a; font-size:33px; text-shadow:0 0 10px rgba(255,196,80,.9),0 2px 6px rgba(0,0,0,.55);}
  .fhurt{position:absolute; font-size:24px; font-weight:800; color:var(--red); animation:fly 0.9s ease-out forwards;}
  .fheal{position:absolute; font-size:20px; font-weight:800; color:var(--green); animation:fly 0.9s ease-out forwards;}
  @keyframes fly{0%{transform:translateY(0); opacity:1;} 100%{transform:translateY(-58px); opacity:0;}}
  .shake{animation:shake 0.3s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);}}
  .flashred{animation:flashred 0.35s;}
  @keyframes flashred{0%{background:rgba(248,113,113,.25);} 100%{background:transparent;}}

  /* 三选一 */
  .choice-title{text-align:center; margin:6px 0 14px;}
  .choice-title h2{font-size:20px; margin:0 0 4px;}
  .pick{padding:14px; border-radius:12px; border:1.5px solid var(--line); background:#1a2d4d; margin-bottom:10px; text-align:left;}
  .pick.rare{border-color:var(--gold); background:rgba(251,191,36,.1);}
  .pick .pname{font-size:16px; font-weight:700;}
  .pick.rare .pname{color:var(--gold);}
  .pick .pdesc{font-size:13px; color:var(--mut); margin-top:5px; line-height:1.6;}
  .rtag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:5px; margin-left:8px;
    background:#2a4066; color:var(--mut);}
  .rtag.rare{background:rgba(251,191,36,.2); color:var(--gold);}

  /* 翻牌抽卡（3D flip + 稀有度光效） */
  .flip-row{display:flex; gap:8px; justify-content:center; margin:6px 0 14px;}
  .flip-card{flex:1; max-width:150px; height:232px; perspective:900px; cursor:pointer;}
  .flip-card.empty{cursor:default;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.2,.8,.25,1); transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-back,.flip-front{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:12px; border:1.5px solid var(--line); overflow:hidden;}
  .flip-back{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(160deg,#16263e,#1c3050);}
  .flip-back .fb-rune{font-size:34px; font-weight:800; color:var(--mut);}
  .flip-back .fb-sub{font-size:11px; color:var(--mut);}
  .flip-front{transform:rotateY(180deg); background:#1a2d4d; padding:10px 8px;
    display:flex; flex-direction:column; align-items:center; text-align:center;}
  .r0{border-color:#46608a;}
  .flip-back.r0 .fb-rune{color:#9db4d0;}
  .r1{border-color:var(--cyan); box-shadow:0 0 14px rgba(56,189,248,.35);}
  .flip-back.r1{background:linear-gradient(160deg,#102540,#173a5e);}
  .flip-back.r1 .fb-rune{color:var(--cyan);}
  .flip-front.r1{border-color:var(--cyan); background:linear-gradient(160deg,#102540,#173452);}
  .r2{border-color:var(--gold); animation:epicGlow 1.6s ease-in-out infinite alternate;}
  .flip-back.r2{background:linear-gradient(160deg,#2a2010,#3a2c12);}
  .flip-back.r2 .fb-rune{color:var(--gold);}
  .flip-front.r2{border-color:var(--gold); background:linear-gradient(160deg,#2a2010,#33260f);}
  @keyframes epicGlow{from{box-shadow:0 0 12px rgba(251,191,36,.4);} to{box-shadow:0 0 26px rgba(251,191,36,.75);}}
  .pf-rarity{font-size:10px; padding:1px 8px; border-radius:5px; background:#2a4066; color:var(--mut);}
  .flip-front.r1 .pf-rarity{background:rgba(56,189,248,.2); color:var(--cyan);}
  .flip-front.r2 .pf-rarity{background:rgba(251,191,36,.25); color:var(--gold);}
  .pf-name{font-size:15px; font-weight:800; margin:6px 0 4px;}
  .flip-front.r1 .pf-name{color:var(--cyan);}
  .flip-front.r2 .pf-name{color:var(--gold);}
  .pf-tags{display:flex; flex-wrap:wrap; gap:3px; justify-content:center; margin-bottom:5px;}
  .ctag{font-size:9px; padding:1px 5px; border-radius:4px; background:#2a4066; color:var(--mut);}
  .pf-desc{font-size:10.5px; color:var(--mut); line-height:1.55; flex:1;}
  .pf-pick{margin-top:6px; width:100%; padding:7px 0; border-radius:8px; border:none; background:var(--cyan); color:#06223a; font-size:12px; font-weight:700;}
  .flip-front.r2 .pf-pick{background:var(--gold); color:#3a2600;}
  .choice-actions{display:flex; flex-direction:column; gap:8px;}
  .ghostbtn.disabled{opacity:.45; pointer-events:none;}
  .pity-hint{font-size:12px; font-weight:700; margin-top:6px;}
  .pity-hint.epic{color:var(--gold); animation:epicGlow 1.2s ease-in-out infinite alternate;}
  .pity-hint.rare{color:var(--cyan);}

  /* 泉 / 商店 */
  .panel-title{text-align:center; font-size:19px; font-weight:700; margin:8px 0 4px;}
  .spring-face{font-size:46px; text-align:center; margin:6px;}
  .goods .good{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 14px; border:1px solid var(--line); border-radius:11px; background:#1a2d4d; margin-bottom:10px;}
  .good .gname{font-size:15px; font-weight:600;}
  .good .gdesc{font-size:12px; color:var(--mut); margin-top:3px;}
  .buybtn{padding:9px 16px; border-radius:9px; border:none; font-size:14px; font-weight:700; white-space:nowrap;
    background:linear-gradient(90deg,#ca8a04,#fbbf24); color:#1a2436;}
  .buybtn:disabled{background:#2a4066; color:var(--mut); cursor:not-allowed;}
  .sold{font-size:12px; color:var(--mut);}

  /* 结算 */
  .result-face{text-align:center; padding:18px 0 8px;}
  .result-face .big{font-size:34px; font-weight:800;}
  .result-face.win .big{color:var(--gold);}
  .result-face.lose .big{color:var(--red);}
  .result-face.endless .big{background:linear-gradient(90deg,#a855f7,#ec4899);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .endless-best{margin-top:10px; font-size:14px; font-weight:700; color:#c084fc;}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
  .statcell{background:#1a2d4d; border:1px solid var(--line); border-radius:10px; padding:11px; text-align:center;}
  .statcell .v{font-size:21px; font-weight:800; color:var(--cyan);}
  .statcell .l{font-size:12px; color:var(--mut); margin-top:3px;}
  .wordlist{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0;}
  .wchip{font-size:13px; padding:4px 10px; border-radius:20px; border:1px solid var(--line); background:#1a2d4d;}
  .wchip.new{border-color:var(--cyan); color:var(--cyan);}
  .wchip.wrong{border-color:var(--red); color:var(--red);}
  .sec-h{font-size:14px; font-weight:700; margin:14px 0 6px;}

 /* ===== 词性标签 ===== */
 .posbadge{display:inline-block; font-size:12px; font-weight:700; padding:1px 8px; border-radius:6px;
   border:1px solid; background:rgba(255,255,255,.04); margin:0 2px;}
 .qhead .posbadge{font-size:13px;}

 /* ===== 复仇：再战徽章 ===== */
 .revbadge{display:inline-block; font-size:12px; font-weight:800; padding:2px 10px; border-radius:7px;
   color:#ffd166; border:1px solid #ff9f43; background:rgba(255,120,60,.16);
   box-shadow:0 0 12px rgba(255,140,60,.35); animation:revpulse 1.2s ease-in-out infinite;}
 @keyframes revpulse{0%,100%{box-shadow:0 0 8px rgba(255,140,60,.3)}50%{box-shadow:0 0 18px rgba(255,160,70,.6)}}

 /* ===== 心流 ===== */
 .flowglow{position:relative;}
 .flowglow::before{content:""; position:absolute; inset:-3px; border-radius:16px; pointer-events:none;
   box-shadow:0 0 0 1.5px rgba(56,189,248,.55), 0 0 22px rgba(56,189,248,.35) inset, 0 0 26px rgba(56,189,248,.25);
   animation:flowpulse 1.6s ease-in-out infinite;}
 @keyframes flowpulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
 .combo-num.flow{color:var(--cyan); text-shadow:0 0 14px rgba(56,189,248,.8); animation:flowpulse 1.2s ease-in-out infinite;}
 .flow-banner{text-align:center; font-size:13px; font-weight:700; color:var(--cyan); margin:6px 0 2px;
   letter-spacing:3px; animation:flowpulse 1.4s ease-in-out infinite;}

 /* ===== 战斗微目标 ===== */
 .mini-goal{display:flex; align-items:center; gap:9px; margin-top:10px; padding:9px 11px; border-radius:10px;

 .mini-goal.done{border-style:solid; border-color:var(--gold); background:rgba(251,191,36,.1);}
 .mini-goal .gico{font-size:16px;}
 .mini-goal .gprog{margin-left:auto; color:var(--gold); font-weight:700; white-space:nowrap;}

 /* ===== 账号等级 / XP ===== */
 .level-card{display:flex; align-items:center; gap:12px;}
 .level-badge{width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
   font-size:18px; font-weight:800; color:#1a2436;

 .level-info{flex:1;}
 .level-info .lab{font-size:12px; display:flex; justify-content:space-between; color:var(--mut); margin-bottom:4px;}

 .levelup-pop{text-align:center; color:var(--gold); font-size:15px; font-weight:700; margin:8px 0;
   animation:flowpulse 1s ease-in-out infinite;}

 /* ===== 每日目标 / streak ===== */
 .streak-row{display:flex; align-items:center; gap:10px; justify-content:center; margin:4px 0 8px;}
 .streak-flame{font-size:22px;}
 .streak-num{font-size:20px; font-weight:800; color:var(--orange);}
 .daily-goal{display:flex; align-items:center; gap:9px; font-size:13px; margin:9px 0;}
 .daily-goal .check{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex:none;
   display:flex; align-items:center; justify-content:center; font-size:12px;}
 .daily-goal.done .check{background:var(--green); border-color:var(--green); color:#0d1828;}
 .daily-goal.done{color:var(--mut);}
 .daily-goal .gprog{margin-left:auto; color:var(--mut); font-size:12px; white-space:nowrap;}

 /* ===== 成就墙 / 弹窗 ===== */
 .ach-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px;}
 .ach-cell{display:flex; gap:9px; align-items:center; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
   background:#1a2d4d;}
 .ach-cell.locked{opacity:.45;}
 .ach-cell .aico{font-size:20px;}
 .ach-cell .aname{font-size:12.5px; font-weight:700; line-height:1.3;}
 .ach-cell .adesc{font-size:11px; color:var(--mut); margin-top:2px; line-height:1.3;}
 .ach-toast{position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:99; width:calc(100% - 40px);
   max-width:440px; display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:12px;
   background:linear-gradient(180deg,#3a2a12,#2a1d0c); border:1.5px solid var(--gold);
   box-shadow:0 8px 26px rgba(0,0,0,.5); animation:toastin .35s ease-out;}
 .ach-toast .aico{font-size:26px;}
 .ach-toast .at{font-size:11px; color:var(--gold); letter-spacing:2px;}
 .ach-toast .an{font-size:15px; font-weight:700;}
 @keyframes toastin{0%{transform:translate(-50%,-20px); opacity:0;} 100%{transform:translate(-50%,0); opacity:1;}}

 /* ============================================================
  * V3 打击与演出动效
  * ============================================================ */
 /* 屏幕震动（多强度） */
 @keyframes hitshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
 @keyframes bigshake{0%,100%{transform:translate(0,0) rotate(0)}15%{transform:translate(-9px,3px) rotate(-.4deg)}30%{transform:translate(8px,-3px) rotate(.4deg)}45%{transform:translate(-7px,2px)}60%{transform:translate(6px,-2px)}75%{transform:translate(-4px,1px)}}
 .hitshake{animation:hitshake .28s}
 .bigshake{animation:bigshake .42s}

 /* 敌人受击（击退+闪白+缩放） */
 @keyframes enemyhit{0%{transform:translateX(0) scale(1);filter:brightness(1)}10%{transform:translateX(16px) scale(.97);filter:brightness(2.6)}22%{transform:translateX(15px) scale(.975);filter:brightness(2.2)}38%{transform:translateX(-6px) scale(1.015);filter:brightness(1.3)}62%{transform:translateX(3px) scale(1)}100%{transform:translateX(0) scale(1);filter:brightness(1)}}
 .enemyhit{animation:enemyhit .42s cubic-bezier(.2,.9,.3,1)}
 @keyframes enemycrit{0%{transform:translateX(0) scale(1);filter:brightness(1)}10%{transform:translateX(30px) scale(.94) rotate(2deg);filter:brightness(3.2) saturate(1.6)}22%{transform:translateX(27px) scale(.95) rotate(1.5deg);filter:brightness(2.8)}34%{transform:translateX(-12px) scale(1.04) rotate(-1.2deg)}52%{transform:translateX(6px)}72%{transform:translateX(-3px)}100%{transform:translateX(0) scale(1) rotate(0)}}
 .enemycrit{animation:enemycrit .55s cubic-bezier(.2,.9,.3,1)}

 /* 攻击波（斩击） */
 .slash{position:absolute;left:50%;width:6px;height:130px;border-radius:6px;
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff,#fbbf24,rgba(255,255,255,0));
  transform:translateX(-50%) scaleY(0);transform-origin:bottom;pointer-events:none;
  box-shadow:0 0 18px rgba(251,191,36,.7);animation:slash .34s cubic-bezier(.5,0,.9,.4) forwards;}
 @keyframes slash{0%{transform:translateX(-50%) scaleY(0);top:62%;opacity:0}20%{opacity:1}55%{transform:translateX(-50%) scaleY(1.15);top:14%}100%{transform:translateX(-50%) scaleY(1);top:9%;opacity:0}}
 .slash.crit{background:linear-gradient(180deg,rgba(255,255,255,0),#fff,#fb923c,rgba(255,255,255,0));box-shadow:0 0 26px rgba(251,146,60,.85);width:9px}

 /* 命中冲击环 */
 .hitring{position:absolute;left:50%;top:16%;width:14px;height:14px;border-radius:50%;
  border:4px solid rgba(255,255,255,.9);transform:translate(-50%,-50%);pointer-events:none;animation:hitring .4s ease-out forwards}
 @keyframes hitring{0%{width:14px;height:14px;opacity:.95;border-width:4px}100%{width:130px;height:130px;opacity:0;border-width:1px}}

 /* 粒子（通用） */
 .particle{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;
  --dx:0px;--dy:0px;animation:particle .6s ease-out forwards}
 @keyframes particle{0%{transform:translate(0,0) scale(1) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}

 /* 伤害数字弹动 */
 @keyframes dmgpop{0%{transform:translate(-50%,0) scale(.4);opacity:0}25%{transform:translate(-50%,-10px) scale(1.25);opacity:1}60%{transform:translate(-50%,-30px) scale(1)}100%{transform:translate(-50%,-64px) scale(.95);opacity:0}}
 @keyframes critpop{0%{transform:translate(-50%,0) scale(.3) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-14px) scale(1.5) rotate(3deg);opacity:1}45%{transform:translate(-50%,-30px) scale(1.15) rotate(-2deg)}100%{transform:translate(-50%,-80px) scale(1.05) rotate(0);opacity:0}}
 @keyframes revpop{0%{transform:translate(-50%,0) scale(.3) rotate(-10deg);opacity:0}18%{transform:translate(-50%,-16px) scale(1.6) rotate(4deg);opacity:1}42%{transform:translate(-50%,-34px) scale(1.2) rotate(-3deg)}70%{transform:translate(-50%,-60px) scale(1.05)}100%{transform:translate(-50%,-92px) scale(1) rotate(0);opacity:0}}
 .fdmg{animation:dmgpop .85s ease-out forwards}
 .fdmg.crit{animation:critpop 1s ease-out forwards}
 .fdmg.rev{animation:revpop 1.1s ease-out forwards}
 /* 连击数字 pulse */
 @keyframes combopulse{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
 .combo-pop{animation:combopulse .35s ease-out}

 /* 玩家受击 vignette */
 .vignette{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;
  box-shadow:inset 0 0 90px 30px rgba(220,38,38,.55)}
 .vignette.flash{animation:vigflash .5s ease-out}
 @keyframes vigflash{0%{opacity:1}100%{opacity:0}}
 .vignette.lowhp{opacity:1;animation:lowhp 1.1s ease-in-out infinite}
 @keyframes lowhp{0%,100%{box-shadow:inset 0 0 70px 20px rgba(220,38,38,.35)}50%{box-shadow:inset 0 0 110px 40px rgba(220,38,38,.6)}}

 /* 敌人死亡消散 */
 @keyframes enemydie{0%{transform:scale(1);opacity:1;filter:brightness(2)}35%{transform:scale(1.08);opacity:.9;filter:brightness(3)}100%{transform:scale(.7) translateY(-30px);opacity:0}}
 .enemydie{animation:enemydie .55s ease-in forwards}

 /* 升级动效 */
 .levelup-overlay{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;pointer-events:none}
 .levelup-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(251,191,36,.5),rgba(251,191,36,0) 60%);animation:luflash 1.3s ease-out forwards}
 @keyframes luflash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
 .levelup-ray{position:absolute;bottom:0;left:50%;width:170px;height:100%;transform:translateX(-50%) scaleY(0);transform-origin:bottom;
  background:linear-gradient(0deg,rgba(251,191,36,.75),rgba(253,230,138,.25),rgba(255,255,255,0));animation:luray 1.3s ease-out forwards}
 @keyframes luray{0%{transform:translateX(-50%) scaleY(0)}25%{transform:translateX(-50%) scaleY(1)}80%{opacity:1}100%{transform:translateX(-50%) scaleY(1);opacity:0}}
 .levelup-card{position:relative;text-align:center;animation:lucard 1.4s cubic-bezier(.2,.9,.3,1) forwards}
 @keyframes lucard{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}45%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
 .lu-text{font-size:46px;font-weight:900;letter-spacing:4px;background:linear-gradient(180deg,#fef3c7,#fbbf24);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(251,191,36,.6))}
 .lu-sub{font-size:20px;font-weight:800;color:#fde68a;margin-top:4px}
 .lu-particle{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fde68a,#fbbf24);
  --dx:0;--dy:0;animation:lupart 1.2s ease-out forwards}
 @keyframes lupart{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

 /* 一屏放下：低视口进一步压缩战斗页垂直空间 */
 @media (max-height:740px){
   #app{padding-top:10px; padding-bottom:14px;}

 }

<body>
<div id="app"></div>
<div class="vignette" id="vignette"></div>
<div id="tipbox"></div>
<div class="backconfirm" id="backconfirm">
  <div class="bc-card">
    <div class="bc-title">放弃本层战斗？</div>
    <div class="bc-sub">当前层的敌人与进度将重置，返回主页后可重新开始。</div>
    <div class="bc-btns">
      <button class="bc-btn ghost" id="bc-cancel">继续战斗</button>
      <button class="bc-btn danger" id="bc-ok">返回主页</button>
    </div>
  </div>
</div>
<script>
/* ============================================================
 * V4.8 音频引擎：程序化合成音效 + 音序器 BGM + 震动
 * 全部用 Web Audio API 实时合成，无外部音频文件，可离线、零体积
 * ============================================================ */
const AUDIO_KEY='word_dungeon_audio_v1';
let AUD={sfx:true,bgm:true,vibrate:true,speak:true,sfxVol:0.85,bgmVol:0.5};
function loadAudioSettings(){ try{Object.assign(AUD,JSON.parse(localStorage.getItem(AUDIO_KEY)||'{}'));}catch(e){} }
function saveAudioSettings(){ try{localStorage.setItem(AUDIO_KEY,JSON.stringify(AUD));}catch(e){} }
loadAudioSettings();

const AudioEngine=(()=>{
  let ctx=null,sfxBus=null,bgmBus=null;
  let schedTimer=null,bgmStep=0,nextStepTime=0,bgmMode='home';

  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx=new AC();
      sfxBus=ctx.createGain(); sfxBus.connect(ctx.destination);
      bgmBus=ctx.createGain(); bgmBus.connect(ctx.destination);
      applyVol();
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function unlock(){ ensure(); }
  function applyVol(){
    if(!ctx) return;
    sfxBus.gain.value=AUD.sfx?AUD.sfxVol:0;
    bgmBus.gain.value=AUD.bgm?AUD.bgmVol:0;
  }

  /* ── 基础合成单元 ── */
  function tone(freq,start,dur,type,vol,slideTo,bus){
    if(!ensure()) return;
    const t0=ctx.currentTime+(start||0);
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(bus||sfxBus);
    o.start(t0); o.stop(t0+dur+0.05);
  }
  function noise(start,dur,vol,filterFreq,ftype,q){
    if(!ensure()) return;
    const t0=ctx.currentTime+(start||0);
    const n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type=ftype||'lowpass';
    f.frequency.value=filterFreq||2000; f.Q.value=q||0.7;
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(t0); src.stop(t0+dur);
  }

  /* ── 音效清单 ── */
  const SFX={
    hit(){ tone(240,0,0.14,'triangle',0.45,70); noise(0,0.07,0.22,2600); },
    crit(){ tone(320,0,0.3,'square',0.32,60); noise(0,0.18,0.3,1800); tone(660,0.02,0.25,'sawtooth',0.18,180); },
    revenge(){ tone(330,0,0.11,'triangle',0.4,330); tone(660,0.1,0.22,'triangle',0.4,660); noise(0,0.12,0.18,3200); },
    enemyDie(){ tone(400,0,0.4,'sawtooth',0.3,50); noise(0,0.3,0.26,1200); },
    hurt(){ tone(130,0,0.3,'sine',0.45,40); noise(0,0.2,0.28,900); },
    correct(){ tone(660,0,0.1,'triangle',0.3); tone(880,0.08,0.14,'triangle',0.3); },
    wrong(){ tone(220,0,0.25,'sawtooth',0.28,110); },
    tap(){ tone(760,0,0.05,'sine',0.2); },
    key(){ tone(520,0,0.04,'sine',0.15); },
    levelup(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.32,'triangle',0.35)); },
    reward(){ tone(1200,0,0.08,'square',0.16); tone(1600,0.07,0.12,'square',0.16); },
    flow(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.06,0.26,'sine',0.26)); },
    node(){ tone(880,0,0.4,'sine',0.26,880); tone(1320,0.05,0.5,'sine',0.18,1320); },
    victory(){
      [523,659,784,1047].forEach((f,i)=>tone(f,i*0.15,0.5,'sawtooth',0.26));
      [523,587,659,784,880,1047].forEach((f,i)=>tone(f,0.7+i*0.1,0.2,'triangle',0.28));
    },
    defeat(){ tone(330,0,0.6,'sawtooth',0.3,110); tone(220,0.3,0.8,'sine',0.28,55); }
  };
  function play(name){
    if(!AUD.sfx) return;
    const f=SFX[name]; if(f) f();
  }
  function fx(name,vib){ play(name); if(vib) vibrate(vib); }

  /* ── 震动（触感） ── */
  function vibrate(p){
    if(!AUD.vibrate) return;
    try{ navigator.vibrate(p); }catch(e){}
  }

  /* ── BGM 音序器（16 步 × 三种场景） ── */
  const BGM={
    home:{bpm:72,root:110,bassLen:7,
      bass:[0,null,null,null,null,null,0,null,null,null,null,null,null,null,null,null],
      lead:[null,null,12,null,null,null,null,null,7,null,null,10,null,null,null,null],
      kick:[],hat:[]},
    battle:{bpm:104,root:110,bassLen:2,
      bass:[0,null,null,0,null,null,0,null,5,null,null,0,null,null,7,null],
      lead:[null,null,null,null,12,null,null,null,null,null,10,null,null,null,null,null],
      kick:[0,4,8,12],hat:[2,6,10,14]},
    boss:{bpm:128,root:110,bassLen:2,
      bass:[0,0,null,0,0,null,0,0,3,0,null,0,0,0,null,0],
      lead:[12,null,12,null,10,null,12,null,15,null,12,null,10,null,7,null],
      kick:[0,3,6,8,11,14],hat:[2,4,6,10,12,14]}
  };
  function bgmTone(freq,t,dur,type,vol){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(bgmBus); o.start(t); o.stop(t+dur+0.05);
  }
  function bgmKick(t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    o.connect(g); g.connect(bgmBus); o.start(t); o.stop(t+0.2);
  }
  function bgmHat(t){
    const n=Math.floor(ctx.sampleRate*0.05);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    s.connect(f); f.connect(g); g.connect(bgmBus); s.start(t);
  }
  function scheduleStep(step,t,cfg,spb){
    const b=cfg.bass[step];
    if(b!==null&&b!==undefined) bgmTone(cfg.root*Math.pow(2,b/12),t,spb*cfg.bassLen,'triangle',0.14);
    const l=cfg.lead[step];
    if(l!==null&&l!==undefined) bgmTone(cfg.root*4*Math.pow(2,l/12),t,spb*1.7,'sine',0.08);
    if(cfg.kick.includes(step)) bgmKick(t);
    if(cfg.hat.includes(step)) bgmHat(t);
  }
  function scheduler(){
    const cfg=BGM[bgmMode];
    const spb=60/cfg.bpm/4;
    while(nextStepTime<ctx.currentTime+0.12){
      scheduleStep(bgmStep,nextStepTime,cfg,spb);
      nextStepTime+=spb; bgmStep=(bgmStep+1)%16;
    }
  }
  function startBgm(mode){
    if(!ensure()) return;
    bgmMode=mode||'home';
    if(!AUD.bgm) return;          // BGM 被关闭：不启动调度
    if(schedTimer) return;
    bgmStep=0; nextStepTime=ctx.currentTime+0.1;
    schedTimer=setInterval(scheduler,25);
  }
  function switchBgm(mode){
    bgmMode=mode;
    if(!schedTimer) startBgm(mode);
  }
  function stopBgm(){ if(schedTimer){clearInterval(schedTimer);schedTimer=null;} }

  return {unlock,applyVol,play,fx,vibrate,startBgm,switchBgm,stopBgm,ensure};
})();

/* 首次任意点击/触摸：解锁音频（浏览器自动播放策略），并按场景启动 BGM */
function unlockAudioOnce(){
  AudioEngine.unlock();
  const s=G?G.screen:'home';
  AudioEngine.startBgm(s==='battle'?(G.battle&&G.battle.kind==='boss'?'boss':'battle'):'home');
}
document.addEventListener('pointerdown',()=>{ unlockAudioOnce(); },{once:true});

/* ============================================================
 * V6.1 单词真人发音（美式）：进入新单词卡片自动发音
 * 联网→在线发音；离线→不发音；全程异步、非阻塞，用户无卡顿感知
 * 主源 有道词典 dictvoice（type=2 美音，URL 直出 MP3，无需 key、覆盖全）
 * ============================================================ */
const WordSpeaker=(()=>{
  let el=null;
  function ensureEl(){
    if(el) return el;
    el=new Audio();
    el.preload='auto';
    // 仅播放、不读取数据，不设 crossOrigin：媒体元素跨域播放天然支持，设置反而要求对方返回 CORS 头
    return el;
  }
  function urlFor(w){
    return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(w)+'&type=2';
  }
  function speak(word){
    if(!word) return;
    if(AUD.speak===false) return;          // 发音开关关闭
    if(navigator.onLine===false) return;   // 离线：不发音
    const a=ensureEl();
    try{ a.pause(); a.currentTime=0; }catch(e){}
    a.src=urlFor(word);
    const p=a.play();                      // 异步加载并播放，不阻塞渲染/交互
    if(p&&p.catch) p.catch(()=>{});        // 自动播放策略/网络失败：静默，不影响游戏
  }
  function stop(){ if(el){ try{el.pause();}catch(e){} } }
  return {speak,stop};
})();

</script>
<script>
/* ============================================================
 * CONFIG —— 单一配置源（ruleset_id: word-dungeon-ruleset-v1）
 * GDD 第 6 章参数表与本对象逐项一致
 * ============================================================ */
const RULESET_ID = 'word-dungeon-ruleset-v1';
const C = {
  player:{ maxHp:100, baseDamage:10 },
  speed:{ fastT:3, normalT:6, fastM:1.5, normalM:1.2 },
  spell:{ base:4, perChar:2, speed:[[60,2.0],[40,1.6],[25,1.25],[0,1.0]] },   // 拼写限时=base+字母数×perChar（含反应余量）；速度按剩余时间比例动态分档
  combo:{ step:0.05, cap:1.0 },
  question:{ timeout:12, pool:{en2cn:0.55, cn2en:0.15, spell:0.10, judge:0.20} },
  proficiency:{ NEW:1.0, LEARNING:1.05, FAMILIAR:1.2, MASTERED:1.4 },
  spring:{ heal:30, reviewCount:3, reviewHeal:2 },
  shop:{ potion:30, normal:50, rare:85, bless:40, epic:150 },
  rerollCost:25,        // 抽卡界面刷新一组候选的词魂消耗
  gold:{ normal:15, elite:35, boss:60 },
  layerCount:3,
  famIntervals:[2,4,7,15],   // FAMILIAR 内复习间隔（天）
  nodeSeq:['normal','normal','elite','spring','shop','boss'],
  flow:{ threshold:5, bonusGold:1 },      // 心流：连击≥5 进入，每答对额外 1 词魂
  focus:{ wrongStreak:2, extraTime:2 },   // 凝神：连续答错 2 题，下一题限时 +2
  revenge:{ base:1.5, perMiss:0.25, cap:2.0 },  // 复仇：错过的词答对伤害更高，按错过次数递增
  xp:{ correct:2, newWord:5, master:10, base:120 },  // XP 与升级曲线
  daily:{ questions:40, newWords:15, run:1 },        // 每日目标
  endless:{
    nodeSeq:['normal','normal','elite','normal','spring','shop','boss'],  // 无尽：每深度 7 节点（战斗更密，泉/商店仍在 Boss 前）
    hpStep:0.15,        // 每加深 1 层，敌人 HP +15%（线性）
    atkStep:0.10,       // 每加深 1 层，敌人攻击 +10%（线性）
    tierStart:4,        // 深度 ≥4 起词难度阶梯抬升
    tierEvery:3,        // 之后每 3 深度抬一档词难度
    timeStart:4,        // 深度 ≥4 起限时开始收紧
    timeEvery:3,        // 每 3 深度 -1 秒
    timeMax:3,          // 限时最多收紧 3 秒
    championEvery:5     // 每 5 深度为“冠军 Boss”（额外强化 + 额外奖励）
  },
  // V7.0 快速刷题：普通/困难/地狱，词频+错误驱动动态权重
  quick:{
    levels:[
      {id:'normal',name:'普通',freqPow:1.0,spellBias:0.0,spellTimeAdd:0,baseFreq:1.0},
      {id:'hard',name:'困难',freqPow:0.5,spellBias:0.35,spellTimeAdd:1,baseFreq:0.6},

/* ============================================================
 * 随机（mulberry32，可复现）
 * ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
function rshuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rpick(a){return a[Math.floor(rnd()*a.length)];}
function wpick(a,w){  // 按权重抽取
  const tot=w.reduce((s,x)=>s+x,0); let r=rnd()*tot;
  for(let i=0;i<a.length;i++){ r-=w[i]; if(r<=0) return a[i]; }
  return a[a.length-1];
}

/* ============================================================
 * V4.3 题型阶梯（先认后背，拼写压轴）+ 自适应 θ + SM-2
 * ============================================================ */
const SRS_LADDER=[10,1440,4320,10080,23040,43200];   // 分钟
const NEW_CAP=20;                                       // 每日新词上限
const TYPE_LADDER=['judge','en2cn','cn2en','spell'];
const STEP_DELAY_MIN=[2,3,5];
const GRAD_REVIEW_TYPE=['cn2en','spell','en2cn','cn2en','en2cn','spell'];
function updateTheta(theta,correct,fast){
  if(correct) theta += fast?0.10:0.05;
  else theta -= 0.10;
  return Math.max(1,Math.min(3,Math.round(theta*1000)/1000));
}
function adaptiveTier(theta){
  const r=rnd(), base=Math.max(1,Math.min(3,Math.round(theta)));
  if(r<0.70) return {tier:base,bucket:'match'};
  if(r<0.85) return {tier:Math.min(3,base+1),bucket:'stretch'};
  return {tier:Math.max(1,base-1),bucket:'consolidate'};
}
function normRec(rec){
  return Object.assign({state:'NEW',step:0,graduated:false,stage:0,lapses:0,
    streak:0,wrong_count:0,due:0,created:0},rec);
}
function typeForWord(rec){
  rec=normRec(rec);
  if(rec.graduated) return GRAD_REVIEW_TYPE[rec.stage];
  return TYPE_LADDER[rec.step];
}
function learnStep(rec,correct,fast,now){
  rec=normRec(rec);
  const s=rec.step;
  if(!correct){
    rec.wrong_count++; rec.state='LEARNING';
    rec.step=Math.max(0,s-1);
    rec.due=now+STEP_DELAY_MIN[rec.step]*60000;
    return rec;
  }
  if(s<3){
    rec.step=s+1; rec.state='LEARNING';
    rec.due=now+STEP_DELAY_MIN[s]*60000;
  } else {
    rec.graduated=true; rec.state='FAMILIAR'; rec.stage=0; rec.streak=0;
    rec.due=now+SRS_LADDER[0]*60000;
  }
  return rec;
}
function gradStep(rec,correct,fast,now){
  rec=normRec(rec);
  const top=SRS_LADDER.length-1;
  if(!correct){
    rec.wrong_count++; rec.lapses++; rec.stage=0; rec.streak=0;
    rec.graduated=false; rec.state='LEARNING';
    rec.step = rec.wrong_count>=2?1:2;
    rec.due=now+STEP_DELAY_MIN[rec.step]*60000;
    return rec;
  }
  if(fast){ rec.stage=Math.min(rec.stage+1,top); rec.streak=0; }
  else {
    rec.streak++;
    if(rec.streak>=2){ rec.stage=Math.min(rec.stage+1,top); rec.streak=0; }
  }
  rec.state = rec.stage===top?'MASTERED':'FAMILIAR';
  rec.due=now+SRS_LADDER[rec.stage]*60000;
  return rec;
}
function schedule(rec,correct,fast,now){
  rec=normRec(rec);
  if(rec.graduated) return gradStep(rec,correct,fast,now);
  return learnStep(rec,correct,fast,now);
}

const IS_APP = !!(window.Capacitor && window.Capacitor.platform && window.Capacitor.platform !== 'web');
/* 通道优先级：① JavaScriptInterface 直连桥（addJavascriptInterface，页面加载前已注册，零时序问题）
                ② Capacitor 插件桥（页面加载后注入，需轮询等待）
                ③ HTTP 本地服务（浏览器/调试） */
let __wdSeq=0; const __wdPending={};
/* 原生端处理完会调用 window.__wdCb(callId, resultJsonOrErrString) */
window.__wdCb=function(id,data){ const f=__wdPending[id]; if(f){ delete __wdPending[id]; f(data); } };
function jsiCall(route,payload){
  return new Promise((resolve,reject)=>{
    const id='w'+(++__wdSeq);
    __wdPending[id]=(data)=>{
      if(typeof data==='string' && data.indexOf('ERR:')===0) reject(new Error(data));
      else { try{ resolve(JSON.parse(data)); }catch(e){ reject(e); } }
    };
    try{ window.WordDungeon.call(id, route, payload?JSON.stringify(payload):''); }
    catch(e){ delete __wdPending[id]; reject(e); }

  async init(){

        this.checking=false;

      this.capFail='插件不可用';
    }
    /* 浏览器：HTTP 后端（开发用） */
    if(IS_APP && !this.base){
      for(let attempt=0;attempt<40 && !this.base;attempt++){

      }
    }
    if(!this.base){ this.on=false; this.checking=false; return false; }   /* 浏览器未配置后端：纯离线 */
    const race=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('api-timeout')),ms))]);
    try{
      if(!this.token){
        const r=await race(fetch(this.base+'/auth/guest',{method:'POST'}),5000);
        const j=await r.json();
        if(j&&j.token){ this.token=j.token; localStorage.setItem('wd_api_token',j.token); }
      }

  },
  async req(path,opt){

      let p=path;
      const qi=path.indexOf('?');
      if(qi>=0){
        p=path.slice(0,qi);
        const q=path.slice(qi+1);
        payload={};
        for(const kv of q.split('&')){
          const eq=kv.indexOf('=');
          if(eq>0) payload[decodeURIComponent(kv.slice(0,eq))]=decodeURIComponent(kv.slice(eq+1));
        }
      }
      if(opt.body){ Object.assign(payload||{},JSON.parse(opt.body)); }
      return await this.jsi.call(p, payload);

      return this.cap.call({route:path, payload});

    opt.headers=Object.assign({'Authorization':'Bearer '+this.token,'Content-Type':'application/json'},opt.headers||{});
    const race=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('api-timeout')),ms))]);

function isEndless(){ return G.mode==='endless'; }
function activeNodeSeq(){ return isEndless()?C.endless.nodeSeq:C.nodeSeq; }
// 无尽深度缩放：HP/攻击线性增长
function endlessScale(d){
  return {hp:1+C.endless.hpStep*(d-1), atk:1+C.endless.atkStep*(d-1)};
}
// 无尽深度 → 词难度下限（d1-3 档1，d4-6 档2，d7+ 档3）
function endlessTierFloor(d){
  return Math.min(3, 1+Math.floor((d-1)/C.endless.tierEvery));
}
// 无尽深度 → 限时收紧（秒），d≥4 起每 3 深度 -1 秒，最多 -3 秒
function endlessTimeCut(d){
  if(d<C.endless.timeStart) return 0;
  return Math.min(C.endless.timeMax, 1+Math.floor((d-C.endless.timeStart)/C.endless.timeEvery));
}
// 无尽深度是否为冠军 Boss（每 5 深度）
function isChampionDepth(d){ return d%C.endless.championEvery===0; }

  if(G.node>=activeNodeSeq().length){ // 本层结束（boss 是最后节点，胜利后会直接处理层推进）
    return;

  const kind=activeNodeSeq()[G.node];
  if(kind==='spring'){ startSpring(); }
  else if(kind==='shop'){ startShop(); }

 * 战斗

function buildEnemy(kind){
  const d=G.layer;
  if(isEndless()){
    const sc=endlessScale(d);
    const champion=isChampionDepth(d);
    if(kind==='boss'){
      // 机制（fog/blur/rage）随深度循环提供变化，但血量/攻击用固定基线（boss1）单调缩放，避免模板差异造成锯齿
      const tpl=ENEMY.boss[(d-1)%ENEMY.boss.length];
      const baseHp=ENEMY.boss[0].hp, baseAtk=ENEMY.boss[0].atk;
      const champMul=champion?1.25:1, champAtk=champion?3:0;
      const hp=Math.round(baseHp*sc.hp*champMul);
      const atk=Math.round(baseAtk*sc.atk)+champAtk;
      return {tpl,name:champion?('冠军·'+tpl.name):tpl.name,maxHp:hp,hp,atk,boss:true,champion};
    }
    const pool = kind==='elite'?ENEMY.elite:ENEMY.normal;
    const t=rpick(pool);
    const baseHp=t.hp[0], baseAtk=t.atk[0];   // 无尽以第 1 层数值为基线再缩放
    const hp=Math.round(baseHp*sc.hp);
    const atk=Math.round(baseAtk*sc.atk);
    return {tpl:t,name:t.name,maxHp:hp,hp,atk,elite:kind==='elite'};
  }
  const li=d-1;
  if(kind==='boss'){
    const t=ENEMY.boss[li];
    return {tpl:t, name:t.name, maxHp:t.hp, hp:t.hp, atk:t.atk, boss:true};
  }
  const pool = kind==='elite'?ENEMY.elite:ENEMY.normal;
  const t=rpick(pool);
  return {tpl:t, name:t.name, maxHp:t.hp[li], hp:t.hp[li], atk:t.atk[li], elite:kind==='elite'};
}

function questionLimit(qtype,wordLen){
  // 拼写题限时按单词长度动态计算并预留反应余量；选择题/判断题固定 12 秒
  let lim = qtype==='spell' ? (C.spell.base + wordLen*C.spell.perChar) : C.question.timeout;
  const t=G.battle.enemy.tpl;
  if(t.timeMod) lim+=t.timeMod;
  if(G.battle.fog) lim=Math.round(lim/2);
  G.cards.forEach(id=>{ const c=CMAP[id]; if(c.timeAdd) lim+=c.timeAdd; });
  if(G.battle.answered<3) G.cards.forEach(id=>{ const c=CMAP[id]; if(c.timeAddFirst) lim+=c.timeAddFirst; });  // 热身：前3题
  if(G.battle.enemy.boss && G.battle.enemy.tpl.mech==='rage' && G.battle.enemy.hp<=G.battle.enemy.maxHp*0.5) lim-=2;
  if(isEndless()) lim-=endlessTimeCut(G.layer);   // 无尽深度：限时随深度收紧
  if(G.focus) lim+=C.focus.extraTime;
  return Math.max(4,lim);
}
/* 拼写题速度：按提交时的剩余时间比例动态加成，越快越高；其他题型保持两档 */
function speedMultFor(q,elapsed){
  if(q.qtype==='spell'){
    const now=performance.now();
    const remainFrac=(q.start+q.limit*1000-now)/(q.limit*1000);
    for(const t of C.spell.speed){ if(remainFrac>=t[0]/100) return t[1]; }
    return 1;
  }
  return elapsed<=C.speed.fastT?C.speed.fastM:elapsed<=C.speed.normalT?C.speed.normalM:1;
}
function pickWordAndType(prefer){
  const maxLen=8;
  // 目标难度档（θ 自适应或手动）；题型永远由单词 step/stage 决定
  let targetTier=null;
  if(isAdaptive()){
    targetTier=adaptiveTier(P.meta.theta).tier;
  } else if(SETTINGS.difficulty){
    targetTier=SETTINGS.difficulty;
  }
  // 无尽：词难度随深度抬升（作为下限，防止深了还在出最简单的词）
  if(isEndless()){
    const floor=endlessTierFloor(G.layer);
    targetTier = targetTier?Math.max(targetTier,floor):floor;
  }
  const now=Date.now();
  // 单局（一次远征）重现上限：答错的词只再出现 1 次（首次答错+1次重现=2次），之后本局不再抽，仅记录归档
  const runCap=w=>!(G.runWrong[w] && (G.runWrongSeen[w]||0)>=1);
  const dl=dueLearning(now).filter(w=>G.layerWords.includes(w)&&runCap(w));
  const dg=dueGraduated(now).filter(w=>G.layerWords.includes(w)&&runCap(w));
  const due=dl.concat(dg);
  const canNew=newToday()<NEW_CAP;

  // 敌人偏好：优先选"自然题型=偏好"的词（拼写守卫/易混词妖），但不硬覆盖新词
  if(prefer){
    const fit=w=>typeForWord(P.words[w])===prefer && (prefer!=='spell'||w.length<=maxLen);
    const dueFit=due.filter(fit);
    if(dueFit.length) return {word:rpick(dueFit),qtype:prefer,review:true,bucket:'match'};
    const cont=Object.keys(P.words).filter(w=>G.layerWords.includes(w)
      && !P.words[w].graduated && fit(w) && runCap(w));
    if(cont.length) return {word:rpick(cont),qtype:prefer,review:false,bucket:'match'};
  }

  const tryNew=canNew && (!due.length || rnd()<0.30);
  let word=null, review=false;
  if(tryNew){
    let unseen=G.layerWords.filter(w=>!P.words[w] && (!targetTier||WMAP[w].t===targetTier));
    if(!unseen.length) unseen=G.layerWords.filter(w=>!P.words[w]);
    if(unseen.length) word=rpick(unseen);
  }
  if(!word){
    if(due.length){
      word=dl.length?rpick(dl):rpick(dg); review=true;
    } else {
      // 无到期：继续推进最接近毕业的学习词（会话节奏）
      const learning=Object.keys(P.words)
        .filter(w=>!P.words[w].graduated && G.layerWords.includes(w) && runCap(w));
      learning.sort((a,b)=>P.words[b].step-P.words[a].step);
      if(learning.length) word=learning[0];
      else if(canNew){
        let unseen=G.layerWords.filter(w=>!P.words[w] && (!targetTier||WMAP[w].t===targetTier));
        if(!unseen.length) unseen=G.layerWords.filter(w=>!P.words[w]);
        if(unseen.length) word=rpick(unseen);
      }
      if(!word){
        const rest=G.layerWords.filter(runCap);
        if(rest.length) word=rpick(rest);
      }
    }
  }
  // 题型永远来自阶梯；超长词降级
  let qtype=typeForWord(P.words[word]);
  if(qtype==='spell'&&word.length>maxLen) qtype='cn2en';
  return {word,qtype,review,bucket:isAdaptive()?'match':'normal'};
}

 * V7.0 快速刷题本地逻辑（与后端 core.draw_quick 等价，离线兜底）
 * ════════════════════════════════════════════════════════ */
const QUICK_LEVELS={};

function freqScore(word){
  const f=WMAP[word].f||999999;
  if(f>=999999) return C.quick.noFreqScore;
  return Math.max(0,1-Math.log10(Math.max(1,f))/Math.log10(C.quick.freqRef));
}
function emptyWrongBy(){
  const e={judge:0,en2cn:0,cn2en:0,spell:0};
  return {normal:Object.assign({},e),hard:Object.assign({},e),hell:Object.assign({},e)};
}
function normWrongBy(wb){
  const base=emptyWrongBy();
  if(wb){['normal','hard','hell'].forEach(l=>{
    if(wb[l]){['judge','en2cn','cn2en','spell'].forEach(t=>{
      base[l][t]=(Number(wb[l][t]||0)||0);
    });}
  });}
  return base;
}
function hasAnyError(wb){
  return ['normal','hard','hell'].some(l=>['judge','en2cn','cn2en','spell'].some(t=>wb[l][t]>0));
}
function errorBoost(wb){
  const q=C.quick; let total=0;
  ['normal','hard','hell'].forEach(g=>{
    ['judge','en2cn','cn2en','spell'].forEach(t=>{
      total+=wb[g][t]*q.levelFactor[g]*q.qtypeFactor[t];
    });
  });
  return total*q.errorCoeff;
}
function markQuickWrong(rec,level,qtype){
  rec=normRec(rec);
  const wb=normWrongBy(rec.wrong_by);
  wb[level][qtype]++;
  rec.wrong_by=wb; rec.quick_pass=false;
  return rec;
}
function markQuickPass(rec){
  rec=normRec(rec);
  const wb=normWrongBy(rec.wrong_by);
  if(!hasAnyError(wb)) rec.quick_pass=true;
  rec.wrong_by=wb;
  return rec;
}
function canSpellQuick(rec,w){
  if(w.length>8) return false;
  rec=normRec(rec);
  if(rec.graduated) return typeForWord(rec)==='spell';
  return rec.step>=3;
}
function quickWeight(word,rec,level){
  const q=C.quick, lcfg=QUICK_LEVELS[level];
  const fs=freqScore(word);
  const base=q.floor+lcfg.baseFreq*Math.pow(Math.max(fs,0),lcfg.freqPow);
  const wb=normWrongBy((rec||{}).wrong_by);
  const eb=errorBoost(wb);
  let w=base*(1+eb);
  if(!hasAnyError(wb)&&(rec||{}).quick_pass){
    const supp=(q.passSuppress[level]!==undefined)?q.passSuppress[level]:1;
    w=base*supp+q.carousel;
  }
  return Math.max(0,w);
}
function drawQuickLocal(level){
  const b=G.battle, lcfg=QUICK_LEVELS[level];
  const pool=G.layerWords.slice();
  const runCap=w=>!(G.runWrong[w]&&(G.runWrongSeen[w]||0)>=1);
  const spellC=pool.filter(w=>runCap(w)&&canSpellQuick(P.words[w],w))
    .map(w=>[w,quickWeight(w,P.words[w],level)]).filter(x=>x[1]>0);
  let word,qtype;
  if(spellC.length&&rnd()<lcfg.spellBias){
    word=weightedPick(spellC.map(x=>x[0]),spellC.map(x=>x[1])); qtype='spell';
  }else{
    let c=pool.filter(runCap).map(w=>[w,quickWeight(w,P.words[w],level)]).filter(x=>x[1]>0);
    if(!c.length) c=pool.filter(runCap).map(w=>[w,1]);
    word=weightedPick(c.map(x=>x[0]),c.map(x=>x[1]));
    qtype=typeForWord(P.words[word]);
    if(qtype==='spell'&&!canSpellQuick(P.words[word],word)) qtype='cn2en';
    if(qtype==='spell'&&word.length>8) qtype='cn2en';
  }
  if(G.runWrong[word]) G.runWrongSeen[word]=(G.runWrongSeen[word]||0)+1;
  const o=WMAP[word];
  const limit=(qtype==='spell')
    ? (C.spell.base+word.length*C.spell.perChar+lcfg.spellTimeAdd)
    : C.quick.choiceT;
  const q={word,qtype,options:null,correct:word,start:performance.now(),limit,quickLevel:level};
  if(qtype==='en2cn'){
    const g=groupOf(word); let distract=[];
    const p2=G.layerWords.filter(x=>x!==word&&(!g||!g.includes(x)));
    rshuffle(p2);
    p2.forEach(x=>{if(distract.length<3&&!distract.includes(WMAP[x].m))distract.push(WMAP[x].m);});
    q.options=rshuffle([o.m,...distract.slice(0,3)]); q.correct=o.m;
  }else if(qtype==='cn2en'){
    const g=groupOf(word); let distract=[];
    const p2=G.layerWords.filter(x=>x!==word&&(!g||!g.includes(x)));
    rshuffle(p2);
    p2.forEach(x=>{if(distract.length<3&&!distract.includes(x))distract.push(x);});
    q.options=rshuffle([word,...distract.slice(0,3)]); q.correct=word;
  }else if(qtype==='judge'){
    const rec=P.words[word];
    const isFirst=!rec||(!rec.graduated&&rec.step===0);
    if(isFirst||rnd()<0.5){ q.judgeShown=o.m; q.correct='yes'; }
    else{
      const others=G.layerWords.filter(x=>x!==word);
      q.judgeShown=WMAP[rpick(others)].m; q.correct='no';
    }
    q.options=['yes','no'];
  }
  return q;
}

function nextQuestion(){
  const b=G.battle;
  b.locked=false;
  const enemy=b.enemy;
  /* API 模式：出题交给后端（题型阶梯/θ/词书难度/单局封顶/复习队列全部在服务端） */
  if(API.on){
    if(G.mode==='quick'){
      apiDrawAndBuild({
        layer:G.layer, mode:'quick', quick_level:G.quickLevel,
        book:SETTINGS.book,
        run_state:G.apiRunState||{wrong:{},seen:{}}});
      return;
    }
    const forceSpell=G.spellChainNext;
    G.spellChainNext=false;
    if(forceSpell) G.spellChainBonus=true;
    const payload={
      layer:G.layer, mode:G.mode||'campaign',
      book:SETTINGS.book, adaptive:isAdaptive(),
      difficulty:isAdaptive()?undefined:(typeof SETTINGS.difficulty==='number'?SETTINGS.difficulty:undefined),
      force:forceSpell?'spell':undefined,
      run_state:G.apiRunState||{wrong:{},seen:{}}
    };
    apiDrawAndBuild(payload);
    return;
  }
  /* 快速刷题本地模式：词频+错误驱动动态权重 */
  if(G.mode==='quick'){
    const q=drawQuickLocal(G.quickLevel);
    G.battle.q=q;
    if(G.focus) G.battle.focusUsed=true;
    G.focus=false;
    G.screen='battle';
    render();
    startTimer();
    return;
  }
  // boss 机制标记
  if(enemy.boss){
    const t=enemy.tpl;
    b.fog=false; b.blur=false;
    if(t.mech==='fog' && b.answered>0 && b.answered%t.every===0) b.fog=true;
    if(t.mech==='blur' && b.answered>0 && b.answered%t.every===0) b.blur=true;
  }
  const preferType=enemy.tpl.prefer||null;
  // 拼写连锁：上一题拼写答对，强制本题拼写并给 +50% 连锁加成
  const forceSpell=G.spellChainNext;
  G.spellChainNext=false;
  if(forceSpell) G.spellChainBonus=true;
  let pick=null;
  if(forceSpell){
    const can=G.layerWords.filter(w=>w.length<=8 && (!G.runWrong[w]||(G.runWrongSeen[w]||0)<1));
    if(can.length){
      const w=rpick(can);
      pick={word:w,qtype:'spell',review:!!P.words[w],bucket:'match'};
    }
  }
  // 易混敌人：优先用能配组的词（题型仍走阶梯，不硬覆盖）
  if(enemy.tpl.confuse && !pick){
    const candidates=G.layerWords.filter(w=>groupOf(w)&&(!G.runWrong[w]||(G.runWrongSeen[w]||0)<1));
    if(candidates.length){
      const w=rpick(candidates);
      let qt=typeForWord(P.words[w]);
      if(qt==='spell'&&w.length>8) qt='cn2en';
      pick={word:w,qtype:qt,review:!!P.words[w],bucket:'match'};
    }
  }
  if(!pick) pick=pickWordAndType(preferType);
  // 若该词本局已答错，本次是它的重现，计数+1（达到上限后下次不再抽）
  if(G.runWrong[pick.word]) G.runWrongSeen[pick.word]=(G.runWrongSeen[pick.word]||0)+1;
  G.curBucket=pick.bucket;
  buildQuestion(pick.word,pick.qtype);
}
/* 后端出题并渲染题目（API 模式） */
function apiDrawAndBuild(payload){
  API.draw(payload).then(apiQ=>{
    const b=G.battle;
    if(!b) return;
    cacheEntry(apiQ.word, apiQ.pos, apiQ.mean, apiQ.t, apiQ.b);   // 渲染缓存
    const q={word:apiQ.word,qtype:apiQ.qtype,start:performance.now(),
      limit:apiQ.timeLimit||6, options:apiQ.options||null,
      correct:apiQ.correct, judgeShown:apiQ.judgeShown||null};
    b.q=q;
    G.apiRunState=apiQ.run_state||G.apiRunState||{wrong:{},seen:{}};
    if(G.focus) b.focusUsed=true;
    G.focus=false;
    G.screen='battle';
    render();
    startTimer();
  }).catch(()=>{
    API.on=false; apiToast('后端不可达 · 已切换离线模式');
    G.screen='home'; render();
  });
}
function buildQuestion(word,qtype){
  const b=G.battle, o=WMAP[word];
  let limit=questionLimit(qtype,word.length);   // 拼写题按字母数动态限时（含反应余量）
  const q={word,qtype,options:null,correct:word,start:performance.now(),limit};
  if(qtype==='en2cn'||qtype==='cn2cn' || qtype==='cn2en'){
    let distract;
    const g=groupOf(word);
    if(b.enemy.tpl.confuse && g){
      distract=g.filter(x=>x!==word);
    }
    const pool=G.layerWords.filter(x=>x!==word && (!g||!g.includes(x)));
    rshuffle(pool);
    if(qtype==='en2cn'){
      distract=(distract||[]).map(x=>WMAP[x].m);
      pool.forEach(x=>{ if(distract.length<3 && !distract.includes(WMAP[x].m)) distract.push(WMAP[x].m); });
      q.options=rshuffle([o.m,...distract.slice(0,3)]);
      q.correct=o.m;
    } else {
      distract=(distract||[]).slice();
      pool.forEach(x=>{ if(distract.length<3 && !distract.includes(x)) distract.push(x); });
      q.options=rshuffle([word,...distract.slice(0,3)]);
      q.correct=word;
    }
  }
  if(qtype==='judge'){
    const rec=P.words[word];
    const isFirst=!rec || (!rec.graduated && rec.step===0);
    const showRight=isFirst || rnd()<0.5;   // 初识固定给正确释义
    if(showRight){
      q.judgeShown=o.m; q.correct='yes';
    } else {
      const g=groupOf(word);
      let wrong=null;
      if(g){
        const sib=g.filter(x=>x!==word);
        if(sib.length)wrong=rpick(sib);
      }
      if(!wrong){
        const others=G.layerWords.filter(x=>x!==word&&(!g||!g.includes(x)));
        wrong=rpick(others);
      }
      q.judgeShown=WMAP[wrong].m; q.correct='no';
    }
    q.options=['yes','no'];
  }
  b.q=q;
  if(G.focus) b.focusUsed=true;
  G.focus=false;   // 凝神只对本题生效
  G.screen='battle';
  render();
  startTimer();
}
let timerRAF=0, timerDeadline=0;
function startTimer(){
  cancelAnimationFrame(timerRAF);
  const q=G.battle.q;
  timerDeadline=q.start+q.limit*1000;
  const tick=()=>{
    const now=performance.now();
    const remain=Math.max(0,timerDeadline-now);
    const ti=document.getElementById('timerfill');
    if(ti){ ti.style.width=(remain/(q.limit*1000)*100)+'%'; }
    const tt=document.getElementById('timetxt');
    if(tt){ tt.textContent=(remain/1000).toFixed(1)+' 秒'; }
    if(now>=timerDeadline){
      // 拼写题填满：限时结束自动按当前内容结算（正常判定）；未填满按超时
      const si=document.getElementById('spellinput');
      if(q.qtype==='spell'&&si&&si._seq&&si._seq.length===q.word.length){
        resolve(si._seq.join('')===q.word?q.word:'__wrong__',false,si._seq.join('')===q.word);
        return;
      }
      resolve(null,true); return;
    }
    timerRAF=requestAnimationFrame(tick);
  };
  timerRAF=requestAnimationFrame(tick);
}
function stopTimer(){ cancelAnimationFrame(timerRAF); }

/* 玩家作答 */
function answer(choice){
  if(!G.battle||G.battle.locked) return;
  const correct = (choice===G.battle.q.correct);
  resolve(choice,false,correct);
}
/* API 模式：卡牌的增伤/暴击在前端判定（卡牌状态在前端），倍率传给后端，由后端权威公式结算 */
function computeCardMods(q){
  const word=q.word;
  const elapsed=(performance.now()-q.start)/1000;
  const ctx={time:elapsed,qtype:q.qtype,mstate:wState(word),word};
  let critChance=0, critMult=2, cardMult=1;
  G.cards.forEach(id=>{
    const c=CMAP[id];
    if(c.mult) cardMult*=c.mult(ctx);
    if(c.crit) critChance+=c.crit;
    if(c.critMult) critMult=c.critMult;
  });
  if(G.blessForLayer===G.layer) cardMult*=1.25;
  if(G.spellChainBonus) cardMult*=1.5;
  const crit=rnd()<critChance;
  return {cardMult:cardMult, crit:crit, critMult:critMult};
}
function resolve(choice,isTimeout,forceCorrect,apiRes){
  const b=G.battle; if(b.locked) return; b.locked=true; stopTimer();
  const q=b.q, word=q.word;
  const elapsed=(performance.now()-q.start)/1000;
  /* API 模式：先把结果交给后端结算（判定/伤害/θ/SM-2），回来再走表现层 */
  if(API.on && !apiRes){
    const remain=Math.max(0,(q.start+q.limit*1000-performance.now())/1000);
    const mods=computeCardMods(q);
    API.answer({
      word, qtype:q.qtype,
      answer: isTimeout?'__timeout__':(choice===null?'':choice),
      time_limit:q.limit, remain,
      combo:G.combo, crit:mods.crit, crit_mult:mods.critMult, card_mult:mods.cardMult,
      shown:q.judgeShown||null,
      mode:G.mode||'campaign',
      quick_level:G.mode==='quick'?G.quickLevel:undefined,
      run_state:G.apiRunState||{wrong:{},seen:{}}
    }).then(res=>{
      if(!G.battle||G.battle.q!==q){ b.locked=false; return; }
      if(res.theta) P.meta.theta=res.theta;
      G.apiRunState=res.run_state||G.apiRunState;
      b.locked=false;                // 解锁后重入结算（表现层）
      resolve(choice,isTimeout,res.correct,res);
    }).catch(()=>{
      API.on=false; b.locked=false; apiToast('网络异常 · 已切换离线模式'); resolve(choice,isTimeout,forceCorrect);
    });
    return;
  }
  const isCorrect = isTimeout?false:(forceCorrect!==undefined?forceCorrect:choice===q.correct);
  G.stats.questions++; b.answered++; G.answeredThisLayer++;
  const mstate=wState(word);

  if(isCorrect){
    G.stats.correct++;
    const isNew=mstate==='NEW';
    if(isNew) G.stats.newWords.add(word);
    else G.stats.reviewWords.add(word);
    // 每日目标 + XP
    dailyProgress().questions++;
    if(isNew) P.meta.daily.newWords++;
    const leveled=addXP(C.xp.correct+(isNew?C.xp.newWord:0));
    if(leveled) showLevelUp(P.meta.level);
    /* API 模式：伤害/暴击/复仇由后端结算（detail 含各倍率），本地只做表现 */
    if(apiRes && apiRes.damage!==undefined){
      const d=apiRes.detail||{};
      const ctx={time:elapsed,qtype:q.qtype,mstate:mstate,word:word,dmg:apiRes.damage,crit:!!d.crit};
      dealDamage(b.enemy,apiRes.damage,!!d.crit,!!d.revenge);
      G.combo++; if(G.combo>G.stats.maxCombo)G.stats.maxCombo=G.combo;
      const comboEl=document.querySelector('.combo-num');
      if(comboEl){comboEl.textContent=G.combo;}
      G.wrongStreak=0;
      if(!G.flow && G.combo>=C.flow.threshold){ G.flow=true; AudioEngine.fx('flow',20); floatText('fheal','心流开启',50); }
      if(G.flow){ G.gold+=C.flow.bonusGold; AudioEngine.play('reward'); floatText('fdmg','+'+C.flow.bonusGold,72); }
      G.cards.forEach(id=>{ const c=CMAP[id]; if(c.onCorrect)c.onCorrect(ctx); });
      G.spellChainBonus=false;
      G.wrongWords[word]=false;
      markOptions(true,q.correct);
      updateGoal(true);
      checkMasterAch();
      if(G.combo>=10) unlockAch('combo10');
      if(G.stats.correct>=50) unlockAch('correct50');
    } else {
    // 伤害
    const ctx={time:elapsed,qtype:q.qtype,mstate,word};
    const isRevenge=G.wrongWords[word]===true;   // 之前错过的词：复仇
    let critChance=0, critMult=2, cardMult=1;
    G.cards.forEach(id=>{
      const c=CMAP[id];
      if(c.mult) cardMult*=c.mult(ctx);
      if(c.crit) critChance+=c.crit;
      if(c.critMult) critMult=c.critMult;
    });
    if(G.blessForLayer===G.layer) cardMult*=1.25;
    const sm=speedMultFor(q,elapsed);
    const remainFrac=(q.start+q.limit*1000-performance.now())/(q.limit*1000);
    const fast=isFastAnswer(q,elapsed,remainFrac);
    const cm=Math.min(1+C.combo.step*G.combo,1+C.combo.cap);
    const pm=C.proficiency[mstate];
    let rv=1;
    if(isRevenge){
      const misses=G.wrongCount[word]||1;
      rv=Math.min(C.revenge.base+C.revenge.perMiss*(misses-1),C.revenge.cap);
    }
    let dmg=C.player.baseDamage*sm*cm*pm*cardMult*rv;
    let crit=rnd()<critChance;
    if(crit) dmg*=critMult;
    dmg=Math.ceil(dmg);
    dealDamage(b.enemy,dmg,crit,isRevenge&&!crit);
    G.combo++; if(G.combo>G.stats.maxCombo)G.stats.maxCombo=G.combo;
    const comboEl=document.querySelector('.combo-num');
    if(comboEl){comboEl.textContent=G.combo;}
    G.wrongStreak=0;
    // 心流：连击达到阈值进入，进入后每答对额外词魂
    if(!G.flow && G.combo>=C.flow.threshold){ G.flow=true; AudioEngine.fx('flow',20); floatText('fheal','心流开启',50); }
    if(G.flow){ G.gold+=C.flow.bonusGold; AudioEngine.play('reward'); floatText('fdmg','+'+C.flow.bonusGold,72); }
    ctx.dmg=dmg; ctx.crit=crit;
    G.cards.forEach(id=>{ const c=CMAP[id]; if(c.onCorrect)c.onCorrect(ctx); });
    G.spellChainBonus=false;   // 连锁加成仅作用于被强制的那一题
    applySrs(word,true,fast);
    if(G.mode==='quick'){
      P.words[word]=markQuickPass(P.words[word]);
      Save.write();
    }
    G.wrongWords[word]=false;
    markOptions(true,q.correct);
    // 微目标 + 掌握成就
    updateGoal(true);
    checkMasterAch();
    if(G.combo>=10) unlockAch('combo10');
    if(G.stats.correct>=50) unlockAch('correct50');
    }
  } else {
    G.stats.wrong++;
    dailyProgress().questions++;
    // 连击 / 心流中断
    if(hasCard('unstop')) G.combo=Math.floor(G.combo/2);
    else G.combo=0;
    G.flow=false;
    G.wrongStreak++;
    if(G.wrongStreak>=C.focus.wrongStreak && !G.focus){ G.focus=true; floatText('fheal','凝神',50); }
    G.cards.forEach(id=>{ const c=CMAP[id]; if(c.onWrong)c.onWrong(); });
    // 敌人攻击
    let dmg=b.enemy.atk;
    if(isTimeout){
      if(q.qtype==='spell') dmg*=0.5;        // 拼写题超时：打字慢，惩罚减半
      else if(hasCard('timectrl')) dmg*=0.5;
    }
    // boss3 狂暴
    if(b.enemy.boss&&b.enemy.tpl.mech==='rage'&&b.enemy.hp<=b.enemy.maxHp*0.5) dmg+=4;
    hurtPlayer(dmg);
    if(!apiRes) applySrs(word,false,false);   // API 模式调度已在服务端完成
    if(!apiRes && G.mode==='quick'){
      P.words[word]=markQuickWrong(P.words[word],G.quickLevel,q.qtype);
      Save.write();
    }
    G.wrongWords[word]=true;
    G.wrongCount[word]=(G.wrongCount[word]||0)+1;
    // 单局记录：首次答错标记，留给它 1 次重现；之后仅归档、本局不再抽
    if(!G.runWrong[word]){ G.runWrong[word]=true; G.runWrongSeen[word]=0; }
    if(choice!==null) markOptions(false,choice);
    updateGoal(false);
  }

  const delay=isCorrect?480:1000;   // 答错停留 1 秒看清错误与受击，答对快速连击
  setTimeout(()=>{
    if(b.enemy.hp<=0){ enemyDeathThenWin(); return; }
    if(G.hp<=0){ defeat(); return; }
    nextQuestion();
  }, delay);
}
function enemyDeathThenWin(){
  const card=document.getElementById('enemycard');
  AudioEngine.fx('enemyDie',25);
  burst(50,16,26,'#fbbf24',120);
  burst(50,16,14,'#ffffff',92);
  if(card){
    card.classList.add('enemydie');
  }
  setTimeout(()=>{ if(G.mode==='quick') winQuickBattle(); else winBattle(); },520);
}
function markOptions(isCorrect,choice){
  document.querySelectorAll('.opt').forEach(el=>{
    el.classList.add('dim');
    if(el.getAttribute('data-val')===G.battle.q.correct) el.classList.add('correct');
    if(!isCorrect && el.getAttribute('data-val')===choice) el.classList.add('wrong');
  });
  document.querySelectorAll('.judgebtn').forEach(el=>{
    el.classList.add('dim');
    if(el.getAttribute('data-val')===G.battle.q.correct) el.classList.add('correct');
    if(!isCorrect && el.getAttribute('data-val')===choice) el.classList.add('wrong');
  });
  const cells=document.querySelectorAll('#spellcells .spellcell');

function updateGoal(correct){

  const g=b.goal; if(g.done) return;
  if(g.kind==='combo'){
    g.prog=Math.max(g.prog,G.combo);
    if(g.prog>=g.target) completeGoal();
  } else if(g.kind==='correct'){

    if(g.prog>=g.target) completeGoal();

    if(!correct) g.failed=true;

}

/* ══ 技能卡发放：三级稀有度 + 动态概率 + 保底 + 流派协同 ══ */
function rarityTable(kind){
  const base={
    normal:  {0:0.82,1:0.16,2:0.02},
    elite:   {0:0.55,1:0.38,2:0.07},
    boss:    {0:0.30,1:0.55,2:0.15},
    champion:{0:0.12,1:0.55,2:0.33},
  }[kind];
  const t={0:base[0],1:base[1],2:base[2]};
  const d=G.layer-1;
  let rareAdd=isEndless()?d*0.012:d*0.05;
  let epicAdd=isEndless()?d*0.006:d*0.02;
  rareAdd=Math.min(rareAdd,0.30); epicAdd=Math.min(epicAdd,0.20);
  // 限制总增量：common 至少保留 0.02，防止高层/深无尽把普通概率扣成负数
  let move=Math.min(rareAdd+epicAdd, Math.max(0,t[0]-0.02));
  const scale=(rareAdd+epicAdd)>0?move/(rareAdd+epicAdd):0;
  rareAdd*=scale; epicAdd*=scale;
  t[1]+=rareAdd; t[2]+=epicAdd; t[0]-=rareAdd+epicAdd;
  return t;
}
function rollSlotRarity(kind,force){
  const t=rarityTable(kind);
  const r=rnd();
  if(force===2)return 2;
  if(force===1)return r<t[2]/(t[1]+t[2])?2:1;
  if(r<t[2])return 2;
  if(r<t[2]+t[1])return 1;
  return 0;
}
function weightedPick(pool,weights){
  const sum=weights.reduce((a,b)=>a+b,0);
  let r=rnd()*sum;
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
/* 玩家最大 HP：含 glasscannon 等 maxHpAdd */
function maxHp(){
  let m=C.player.maxHp;
  G.cards.forEach(id=>{const c=CMAP[id];if(c.maxHpAdd)m+=c.maxHpAdd;});
  return m;
}
/* 按稀有度抽一张：同流派协同加权 + 残血怜悯（防御/恢复卡） */
function drawCardOfRarity(r,exclude){
  exclude=exclude||[];
  const exId=exclude.map(c=>c.id);
  const free=c=>!G.cards.includes(c.id)&&!exId.includes(c.id);
  let pool=CARDS.filter(c=>c.rare===r&&free(c));
  if(!pool.length)pool=CARDS.filter(c=>c.rare>=r&&free(c));
  if(!pool.length)pool=CARDS.filter(c=>free(c));
  if(!pool.length)return null;
  const tagCount={};
  G.cards.forEach(id=>{const c=CMAP[id];(c.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1);});
  const lowHp=G.hp/maxHp()<0.35;
  const weights=pool.map(c=>{
    let w=1;
    (c.tags||[]).forEach(t=>{if(tagCount[t])w+=0.5*tagCount[t];});
    if(lowHp&&(c.tags||[]).some(t=>t==='sustain'||t==='shield'))w+=1.2;
    return w;
  });
  return weightedPick(pool,weights);
}
/* 三槽：保底 + 独立 roll，返回 [{card,rare}]，并更新保底计数 */
function drawChoice(kind){
  let force=0;
  if(G.epicPity>=6)force=2;
  else if(G.pity>=3)force=1;
  const rars=[0,1,2].map(i=>i===0?rollSlotRarity(kind,force):rollSlotRarity(kind,0));
  const taken=[];
  const slots=rars.map(r=>{
    const card=drawCardOfRarity(r,taken);
    if(card)taken.push(card);
    return {card,rare:r};
  });
  const maxR=Math.max(...rars);
  if(maxR===0){G.pity++;G.epicPity++;}
  else if(maxR===1){G.pity=0;G.epicPity++;}
  else {G.pity=0;G.epicPity=0;}
  return slots;
}
/* 刷新：消耗词魂重抽一组（不消耗保底），每场胜利限一次 */
function rerollChoice(){
  if(G.rerollUsed||G.gold<C.rerollCost)return;
  G.gold-=C.rerollCost; G.rerollUsed=true;
  G.pity=G.choice.pityBefore.p; G.epicPity=G.choice.pityBefore.e;
  G.choice.slots=drawChoice(G.choice.nodeKind);
  G.choice.revealed=[false,false,false];
  G.choice.autoStarted=false;
  G.choice.pityBefore={p:G.pity,e:G.epicPity};
  render();
}
function pickCard(id){
  if(id) G.cards.push(id);
  G.choice=null;
  if(G.cards.length>=5) unlockAch('cards5');
  if(G.cards.length>=10) unlockAch('cards10');
  afterNodeResolved();
}

function afterNodeResolved(){
  // 非战斗节点（泉/商店）或战斗结束后推进
  const cur=activeNodeSeq()[G.node];
  if(cur==='boss'){
    // Boss 过
    if(isEndless()){
      // 无尽：继续下潜，永不通关（直到死亡）
      G.layer++; G.screen='map';
      setTimeout(()=>{ enterLayer(); }, 250);
      render();
      return;
    }
    // 远征：进入下一层或通关
    if(G.layer>=C.layerCount){
      G.result='win'; G.screen='result';
      AudioEngine.fx('victory',[60,40,60,40,120]);
      markStreak();
      unlockAch('first_win');
      Save.write(P); render(); return;
    }
    G.layer++; G.screen='map';
    setTimeout(()=>{ enterLayer(); }, 250);
    render();
    return;
  }
  G.node++;
  nextNode();
}

function startSpring(from){

  let wr=Object.keys(G.wrongWords).filter(w=>G.wrongWords[w]);
  wr.sort((a,b)=>gradeOf(b)-gradeOf(a));
  if(wr.length<C.spring.reviewCount){
    const extra=Object.keys(P.words).filter(w=>P.words[w].state==='LEARNING'&&!wr.includes(w));
    wr=wr.concat(extra);
  }
  G.screen='spring';
  G.springData={healed:C.spring.heal, list:wr.slice(0,C.spring.reviewCount), idx:0, bonus:0, done:wr.length===0, from:from||'node'};
  render();
}
function springAnswer(ok){
  const s=G.springData;
  if(ok){ s.bonus+=C.spring.reviewHeal; G.hp=Math.min(C.player.maxHp,G.hp+C.spring.reviewHeal); }
  const w=s.list[s.idx];
  if(API.on&&w){
    API.wrongReview(w,ok).then(()=>{ if(ok) G.wrongWords[w]=false; }).catch(()=>{ API.on=false; });
  } else if(w){
    if(ok){ applySrs(w,true,false); G.wrongWords[w]=false; }
    else { applySrs(w,false,false); }
  }
  s.idx++;
  if(s.idx>=s.list.length){ s.done=true; }
  render();
}

/* 错词本：按错误次数分级（顽固 3+ / 易错 2 / 生疏 1），常驻复习入口 */
function wrongBookData(){
  if(API.on&&apiData&&apiData.wb){
    return apiData.wb.words.map(x=>({w:x.word,n:x.wrong_count,g:x.grade}));
  }
  const set={};
  Object.keys(G.wrongWords).forEach(w=>{ if(G.wrongWords[w]) set[w]=G.wrongCount[w]||1; });
  Object.keys(P.words).forEach(w=>{ if(P.words[w].state==='LEARNING'&&!(w in set)) set[w]=1; });
  const list=Object.keys(set).map(w=>({w,n:set[w],g:set[w]>=3?3:set[w]===2?2:1}));
  list.sort((a,b)=>b.g-a.g||b.n-a.n);
  return list;
}
function wrongBookBtn(){
  const list=wrongBookData();
  const cnt=list.filter(x=>x.g===3).length;
  const total=list.length;
  return `<button class="bigbtn ghost" data-act="wrongbook" style="margin-top:10px;">
    错词本（${total} 词${cnt?` · 顽固 ${cnt}`:''}）</button>`;
}
/* V7.0 错词本：把“在哪个档/哪个题型错过”渲染成标签 */
function wrongByTags(w){
  const rec=P.words[w];
  if(!rec||!rec.wrong_by) return '';
  const wb=normWrongBy(rec.wrong_by);
  const lname={normal:'普通',hard:'困难',hell:'地狱'};
  const tname={judge:'判断',en2cn:'选义',cn2en:'选词',spell:'拼写'};
  const tags=[];
  ['normal','hard','hell'].forEach(l=>{
    ['judge','en2cn','cn2en','spell'].forEach(t=>{
      if(wb[l][t]>0) tags.push(`${lname[l]}${tname[t]}×${wb[l][t]}`);
    });
  });
  if(!tags.length) return '';
  return `<div class="wbtags">${tags.map(t=>`<span class="wbtag">${t}</span>`).join('')}</div>`;
}
function viewWrongBook(){
  const list=wrongBookData();
  const gName={3:'顽固',2:'易错',1:'生疏'};
  const gColor={3:'var(--red)',2:'var(--orange)',1:'var(--gold)'};
  const groups=[3,2,1].map(g=>list.filter(x=>x.g===g));
  return `
   ${topbar()}
   <div class="card">
     <div class="panel-title">错词本</div>

       </div>`).join('')}
     </div>`;
   }).join('')}
   ${list.length?`<button class="bigbtn" data-act="wrongreview" style="margin-top:12px;">开始复习（顽固优先）</button>`:`<div class="card center mut" style="margin-top:12px;">没有错词，继续远征！</div>`}

function spellCells(q){
  const word=q.word;
  const cells=word.split('').map((ch,i)=>
    `<div class="spellcell ${i===0?'active':''}" data-i="${i}"></div>`).join('');
  return `<div class="spellcells" id="spellcells">${cells}</div>
    <input id="spellinput" class="spellhidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" enterkeyhint="done">
    <div class="spelltap" id="spelltap">首字母 ${word[0].toUpperCase()}，共 ${word.length} 个字母，点击此处拼写</div>`;
}
function judgeView(q){
  return `<div class="judge-card">
    <div class="judge-word">${esc(q.word)}</div>
    <div class="judge-mean">${esc(q.judgeShown)}</div>
    <div class="judge-btns">
      <button class="judgebtn yes" data-val="yes"><span class="jic">✓</span>对</button>
      <button class="judgebtn no" data-val="no"><span class="jic">✗</span>错</button>
    </div>
  </div>`;
}
function ladderHTML(word){
  const rec=P.words[word];
  if(rec&&rec.graduated){
    const labels=['10分','1天','3天','7天','16天','30天'];
    return `<div class="ladder"><span class="lad-lab">复习</span><div class="lad-segs">${
      labels.map((l,i)=>`<i class="seg ${i<=rec.stage?'on':''} ${i===rec.stage?'cur':''}">${l}</i>`).join('')
    }</div></div>`;
  }
  const step=rec?rec.step:0;
  const labels=['识','认','写','拼'];
  return `<div class="ladder"><div class="lad-segs">${
    labels.map((l,i)=>`<i class="seg ${i<=step?'on':''} ${i===step?'cur':''}">${l}</i>`).join('')
  }</div></div>`;
}
function viewBattle(){
  const b=G.battle, e=b.enemy, q=b.q;
  const hpPct=Math.round(e.hp/e.maxHp*100);
  const rage=e.boss&&e.tpl.mech==='rage'&&e.hp<=e.maxHp*0.5;
  let opts;
  if(q.qtype==='judge'){
    opts=judgeView(q);
  } else if(q.options){
    opts=q.options.map((o,i)=>
      `<button class="opt" data-val="${esc(o)}"><span class="key">${i+1}</span><span>${esc(o)}</span></button>`).join('');
  } else {
    opts=spellCells(q);
  }
  const nodeLab = b.kind==='boss'?'Boss 战':b.kind==='elite'?'精英战':'普通战';
  const g=b.goal;
  let goalState;

     ${g.quick?'':`<div class="mini-goal ${g.done?'done':''}">
