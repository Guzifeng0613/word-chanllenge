const TAGNAME={aggro:'强攻',combo:'连击',crit:'暴击',spell:'拼写',shield:'护盾',sustain:'续航',revenge:'复仇',gold:'资源'};
const RARITY_NAME=['普通','稀有','史诗'];
function viewChoice(){
  const ch=G.choice;
  if(!ch.revealed) ch.revealed=[false,false,false];
  const cards=ch.slots.map((s,i)=>{
    const c=s.card;
    if(!c){
      return `<div class="flip-card flipped empty" data-i="${i}">
        <div class="flip-inner">
          <div class="flip-back r${s.rare}"></div>
          <div class="flip-front r${s.rare}"><div class="mut" style="padding:18px 8px;">该稀有度已全部收集</div></div>
        </div></div>`;
    }
    const tagLabels=(c.tags||[]).map(t=>`<span class="ctag t-${t}">${TAGNAME[t]}</span>`).join('');
    return `<div class="flip-card ${ch.revealed[i]?'flipped':''}" data-i="${i}">
      <div class="flip-inner">
        <div class="flip-back r${s.rare}">
          <div class="fb-rune">?</div>
          <div class="fb-sub">${RARITY_NAME[s.rare]}</div>
        </div>
        <div class="flip-front r${s.rare}">
          <div class="pf-rarity">${RARITY_NAME[s.rare]}</div>

          <div class="pf-desc">${c.desc}</div>
          <button class="pf-pick" data-pick="${c.id}">选择此卡</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const canReroll=!G.rerollUsed && G.gold>=C.rerollCost;
  const rerollBtn=`<button class="ghostbtn ${canReroll?'':'disabled'}" data-reroll="1">${G.rerollUsed?'已刷新本局':`刷新一组 · ${C.rerollCost} 词魂`}</button>`;
  const pityHint = ch.slots.some(s=>s.rare===2)?'<div class="pity-hint epic">史诗降临！</div>'
    : ch.slots.some(s=>s.rare===1)?'<div class="pity-hint rare">稀有卡出现</div>':'';
  return `
   ${topbar()}
   <div class="choice-title"><h2>战斗胜利 · +${ch.reward} 词魂</h2>

     ${rerollBtn}

   </div>`;
}
/* 翻开指定槽（已翻开则忽略）；史诗翻开时放金光 */
function revealSlot(i){
  const ch=G.choice; if(!ch||ch.revealed[i])return;
  ch.revealed[i]=true;
  const s=ch.slots[i];
  const el=document.querySelector(`.flip-card[data-i="${i}"]`);
  if(el) el.classList.add('flipped');
  if(s.rare===2){
    burst(50,40,22,'#fbbf24',100);
    floatText('fheal','史诗！',40);
  } else if(s.rare===1){
    burst(50,40,12,'#38bdf8',80);
  }
}
/* 自动翻牌：按稀有度从低到高依次翻开，高稀有度压轴，制造期待 */
function autoReveal(){
  const ch=G.choice; if(!ch)return;
  const order=ch.slots.map((s,i)=>({i,r:s.rare})).sort((a,b)=>a.r-b.r).map(x=>x.i);
  order.forEach((i,k)=>{
    setTimeout(()=>revealSlot(i), 350+k*380);
  });
}

function render(){
  let html='';
  switch(G.screen){
    case 'home': html=viewHome(); break;
    case 'battle': html=G.battle?viewBattle():viewHome(); break;
    case 'choice': html=viewChoice(); break;
    case 'spring': html=viewSpring(); break;
    case 'shop': html=viewShop(); break;
    case 'result': html=viewResult(); break;
    case 'map': html=topbar()+`<div class="card center" style="margin-top:30px;"><div class="qword">进入第 ${G.layer} 层……</div></div>`; break;
    case 'wrongbook': html=viewWrongBook(); break;
    case 'settings': html=viewSettings(); break;
    case 'achievements': html=viewAchievements(); break;
    case 'stats': html=viewStats(); break;
    case 'howto': html=viewHowto(); break;
  }
  app.innerHTML=html;
  afterRender();
  sceneBgm();
  maybePronounce();
}
/* 新单词卡片：自动美式发音（在线发音/离线不发音，非阻塞）；同一题不重复发音 */
function maybePronounce(){
  if(G.screen!=='battle') return;
  const b=G.battle;
  if(!b||!b.q||b.q.__spoken) return;
  b.q.__spoken=true;
  WordSpeaker.speak(b.q.word);
}
/* BGM 随场景切换：战斗/Boss 紧张，主页/泉水/商店/结算舒缓 */
function sceneBgm(){
  const s=G.screen;
  let mode='home';
  if(s==='battle'&&G.battle) mode=G.battle.kind==='boss'?'boss':'battle';
  else if(s==='choice') mode='battle';
  AudioEngine.switchBgm(mode);
}

/* 输入绑定（每帧重绘后） */
function afterRender(){
  if(G.screen==='home'){
    /* 模式切换：容器事件委托，整块 tab 都可点；ⓘ 只弹解释、不挡切换 */
    const tabs=document.querySelector('.mode-tabs');
    if(tabs){
      tabs.addEventListener('click',(e)=>{
        if(e.target.closest('.info-tip')) return;   // ⓘ 由自身监听处理（已 stopPropagation）
        const tab=e.target.closest('.mode-tab');
        if(tab){ homeMode=tab.getAttribute('data-mode'); AudioEngine.play('tap'); render(); }
      });
    }
    document.querySelectorAll('[data-quick-level]').forEach(el=>el.addEventListener('click',()=>{
      setQuickLevel(el.getAttribute('data-quick-level')); AudioEngine.play('tap'); render();
    }));
  }
  if(G.screen==='settings'){
    document.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('click',()=>{
      SETTINGS.book=el.getAttribute('data-book'); AudioEngine.play('tap'); saveSettings(); render();
    }));
    document.querySelectorAll('[data-diff]').forEach(el=>el.addEventListener('click',()=>{
      const v=el.getAttribute('data-diff');
      AudioEngine.play('tap');
      SETTINGS.difficulty=v==='auto'?'auto':parseInt(v); saveSettings(); render();
    }));
    /* 声音开关 */
    document.querySelectorAll('[data-audio]').forEach(el=>el.addEventListener('click',()=>{
      const k=el.getAttribute('data-audio');
      AUD[k]=!AUD[k]; saveAudioSettings(); AudioEngine.applyVol();
      el.classList.toggle('on',AUD[k]);
      if(k==='bgm'){ if(AUD.bgm) AudioEngine.startBgm(); else AudioEngine.stopBgm(); }
      if(k==='sfx') AudioEngine.play('tap');
    }));
    /* 音量滑条：实时生效，拖动结束（防抖）保存 */
    let volSaveTimer=null;
    document.querySelectorAll('[data-vol]').forEach(el=>{
      const vv=el.parentElement.querySelector('.vv');
      el.addEventListener('input',()=>{
        const k=el.getAttribute('data-vol');
        AUD[k]=parseInt(el.value)/100;
        if(vv)vv.textContent=el.value;
        AudioEngine.applyVol();
        if(volSaveTimer)clearTimeout(volSaveTimer);
        volSaveTimer=setTimeout(saveAudioSettings,300);
      });
    });
  }
  if(G.screen==='battle'){
    document.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click',()=>answer(el.getAttribute('data-val')));
    });
    document.querySelectorAll('.judgebtn').forEach(el=>{
      el.addEventListener('click',()=>answer(el.getAttribute('data-val')));
    });
    const si=document.getElementById('spellinput');
    if(si){
      const cellsWrap=document.getElementById('spellcells');
      const tap=document.getElementById('spelltap');
      const focusInput=()=>{ try{si.focus();}catch(e){} };
      if(cellsWrap)cellsWrap.addEventListener('click',focusInput);
      if(tap)tap.addEventListener('click',focusInput);
      let autoTimer=null;
      const word=G.battle.q.word;
      let seq=[];                       // 权威输入序列：由键盘事件维护，value 只做回显，防输入法乱序/联想/自动纠错
      si._seq=seq;                      // 暴露给计时器：限时结束按当前内容自动结算
      const renderCells=()=>{
        const cells=cellsWrap.querySelectorAll('.spellcell');
        cells.forEach((c,i)=>{
          c.textContent=seq[i]||'';
          c.classList.remove('active','full');
          if(i===seq.length&&seq.length<word.length)c.classList.add('active');
        });
        if(seq.length===word.length)cells.forEach(c=>c.classList.add('full'));   // 已填满：金色高亮，等待确认/限时结算
      };
      const syncValue=()=>{ if(si.value!==seq.join('')){ si.value=seq.join(''); } };
      const refresh=()=>{
        renderCells(); syncValue();
        // 填满后不再自动提交：提示可回车确认或等待限时结束自动结算
        if(tap) tap.textContent= seq.length===word.length ? '已填满·回车确认 或 等待限时结束自动结算' : ('首字母 '+word[0].toUpperCase()+'，共 '+word.length+' 个字母');
      };
      si.addEventListener('keydown',e=>{
        if(e.key==='Enter'){                       // 回车立即确认提交
          e.preventDefault();
          if(seq.length===word.length&&!G.battle.locked)answer(seq.join('')===word?word:'__wrong__');
          return;
        }
        if(e.key==='Backspace'){                   // 删除键显式处理，不依赖 input 事件，手机删除键立即可用
          e.preventDefault();
          if(seq.length>0){seq.pop(); AudioEngine.play('key');}
          refresh();
          return;
        }
        if(e.key.length===1){                      // 单字符键
          if(/^[a-zA-Z]$/.test(e.key)){
            e.preventDefault();
            if(seq.length<word.length){seq.push(e.key.toLowerCase()); AudioEngine.play('key');}
            refresh();
          }else{
            e.preventDefault();                    // 空格/数字/标点等一律不进格子
          }
        }
        // e.key==='Process'/'Unidentified'（输入法组合）不拦截，交给 input 兜底
      });
      si.addEventListener('input',()=>{            // 键盘兜底：处理不派发 keydown 的输入（部分输入法/虚拟键盘）
        const raw=si.value.toLowerCase().replace(/[^a-z]/g,'').slice(0,word.length);
        const cur=seq.join('');
        if(raw.length<seq.length&&cur.startsWith(raw)){ seq=raw.split(''); refresh(); return; }  // 键盘只发 input 的退格
        // 已确认序列必须是 raw 的子序列（防止联想/纠错把已输入字母重排）
        let j=0; for(let k=0;k<raw.length&&j<seq.length;k++){ if(raw[k]===seq[j]) j++; }
        if(j===seq.length){
          // 子序列成立 → 增量合并：raw 中多出的字母按顺序 append（兼容“插到开头/末尾”）
          let i=0,added='';
          for(let k=0;k<raw.length;k++){
            if(i<seq.length&&raw[k]===seq[i]){ i++; }
            else { added+=raw[k]; }
          }
          if(added){ seq=seq.concat(added.split('')).slice(0,word.length); }
          refresh();
        }else{
          syncValue();                             // 重排/乱序/自动纠错 → 强制恢复回显
        }
      });
      setTimeout(focusInput,60);
    }
    if(G.battle.blur){
      setTimeout(()=>{ const o=document.getElementById('opts'); if(o)o.classList.remove('blurring'); },1300);
    }
  }
  if(G.screen==='choice'){
    if(!G.choice.autoStarted){ G.choice.autoStarted=true; autoReveal(); }
    document.querySelectorAll('.flip-card').forEach(el=>el.addEventListener('click',()=>revealSlot(parseInt(el.getAttribute('data-i')))));
    document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();pickCard(el.getAttribute('data-pick')||null);}));
    const rr=document.querySelector('[data-reroll]');
    if(rr)rr.addEventListener('click',()=>rerollChoice());
  }
  if(G.screen==='spring'){
    document.querySelectorAll('[data-spring]').forEach(el=>el.addEventListener('click',()=>springAnswer(el.getAttribute('data-spring')==='1')));
    const d=document.querySelector('[data-act="springdone"]'); if(d)d.addEventListener('click',springDone);
  }
  if(G.screen==='shop'){
    document.querySelectorAll('[data-buy]').forEach(el=>el.addEventListener('click',()=>buy(el.getAttribute('data-buy'),el.getAttribute('data-id'))));
    const d=document.querySelector('[data-act="shopdone"]'); if(d)d.addEventListener('click',afterNodeResolved);
  }
  if(G.screen==='wrongbook'){
    const r=document.querySelector('[data-act="wrongreview"]'); if(r)r.addEventListener('click',()=>startSpring('wrongbook'));
    const b=document.querySelector('[data-act="wrongback"]'); if(b)b.addEventListener('click',()=>{ G.screen='home'; render(); });
  }
  /* ⓘ 解释角标：点击弹出小窗（showTip 定义于启动区；此处仅绑定新元素） */
  document.querySelectorAll('.info-tip').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      showTip(el);
    });
  });
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click',()=>{
      const a=el.getAttribute('data-act');
      AudioEngine.play('tap');
      if(a==='start-campaign'){ rnd=mulberry32(Date.now()%2147483647); newRun('campaign'); rnd=mulberry32(Date.now()%2147483647); G.screen='map'; enterLayer(); }
      if(a==='start-endless'){ rnd=mulberry32(Date.now()%2147483647); newRun('endless'); rnd=mulberry32(Date.now()%2147483647); G.screen='map'; enterLayer(); }
      if(a==='restart'){ const mode=G.mode; rnd=mulberry32(Date.now()%2147483647); newRun(mode); rnd=mulberry32(Date.now()%2147483647); G.screen='map'; enterLayer(); }
      if(a==='quickexit'){ G.battle=null; G.screen='home'; render(); }
      if(a==='wrongbook'){
        if(API.on){ loadApiData().then(()=>{ G.screen='wrongbook'; render(); }); return; }
        G.screen='wrongbook'; render();
      }
      if(a==='home'){ if(API.on){ loadApiData().then(()=>render()); return; } G.screen='home'; render(); }
      if(a==='settings'){ G.screen='settings'; render(); }
      if(a==='achievements'){ G.screen='achievements'; render(); }
      if(a==='stats'){ G.screen='stats'; render(); }
      if(a==='howto'){ G.screen='howto'; render(); }
      if(a==='homeback'){ G.screen='home'; render(); }
      if(a==='launch'){
        const mode=homeMode;
        rnd=mulberry32(Date.now()%2147483647); newRun(mode);
        rnd=mulberry32(Date.now()%2147483647);
        if(mode==='quick'){
          G.quickLevel=quickLevel;
          G.layerWords=bookWords();
          G.runWrong={}; G.runWrongSeen={};
          startQuickBattle();
        } else {
          G.screen='map'; enterLayer();
        }
      }
      if(a==='api-connect'){
      const inp=document.getElementById('apiBaseInput');
      const v=(inp?inp.value:'').trim().replace(/\/+$/,'');
      if(v){ localStorage.setItem('wd_api_base',v); }
      else { localStorage.removeItem('wd_api_base'); localStorage.removeItem('wd_api_token'); }
      API.base=v; API.token=localStorage.getItem('wd_api_token');
      API.init().then(on=>{ if(on){ apiToast('后端已连接 · 进度将同步'); loadApiData().then(()=>render()); } else { apiToast('连接失败 · 保持离线'); render(); } });
      return;
    }
    if(a==='reset'){ if(confirm('确定清空所有学习进度？')){ Save.reset(); P={words:{}}; newRun(); render(); } }
    });
  });
}

/* 键盘 1-4 全局选择 */
document.addEventListener('keydown',e=>{
  if(G.screen!=='battle'||!G.battle||G.battle.locked)return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  const n=parseInt(e.key);
  if(n>=1&&n<=4&&G.battle.q.options){
    const val=G.battle.q.options[n-1];
    if(val!==undefined)answer(val);
  }
});

/* ⓘ 弹窗：显示/关闭（只绑定一次，不随 render 累积） */
function apiToast(msg){
  const t=document.getElementById('tipbox');
  if(!t) return;
  t.innerHTML='<span style="color:var(--gold)">'+msg+'</span>';
  t.style.display='block';
  t.style.left=Math.max(8,(window.innerWidth-220)/2)+'px';
  t.style.top='38%';
  t.style.background='linear-gradient(180deg,#b45309,#92400e)';
  clearTimeout(apiToast._t);
  apiToast._t=setTimeout(()=>{ t.style.display='none'; t.style.background=''; },2400);
}

function showTip(el){
  const tipbox=document.getElementById('tipbox');
  const r=el.getBoundingClientRect();
  tipbox.innerHTML=el.getAttribute('data-tip')||'';
  tipbox.style.display='block';
  tipbox.style.left=Math.min(r.left,Math.max(8,window.innerWidth-272))+'px';
  tipbox.style.top=(r.bottom+7)+'px';
}
document.addEventListener('click',()=>{
  const tipbox=document.getElementById('tipbox');
  if(tipbox) tipbox.style.display='none';
});

/* Android 返回键：返回上一级；主页再按才退出；战斗中先确认防误触 */
function handleAndroidBack(){
  if(!G) return;
  switch(G.screen){
    case 'settings': case 'wrongbook': case 'achievements': case 'stats': case 'howto':
    case 'result':
      G.screen='home'; render(); break;
    case 'battle': {
      const bc=document.getElementById('backconfirm');
      if(bc && bc.classList.contains('show')){ G.screen='home'; bc.classList.remove('show'); render(); break; }
      if(bc) bc.classList.add('show');
      break;
    }
    case 'choice': case 'spring': case 'shop':
      G.screen='battle'; render(); break;
    default:
      if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
        window.Capacitor.Plugins.App.exitApp();
      }
  }
}
function initAndroidBack(){
  if(!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App)) return;
  window.Capacitor.Plugins.App.addListener('backButton',()=>handleAndroidBack());
  const bc=document.getElementById('backconfirm');
  const cancel=document.getElementById('bc-cancel');
  const ok=document.getElementById('bc-ok');
  if(cancel) cancel.addEventListener('click',()=>{ if(bc)bc.classList.remove('show'); });
  if(ok) ok.addEventListener('click',()=>{ if(bc)bc.classList.remove('show'); G.screen='home'; render(); });
}

/* 启动 */
newRun();
render();
initAndroidBack();
function bootWithRetry(){
  API.init().then(on=>{
    if(on){ apiToast('后端已连接 · 进度将同步'); loadApiData().then(()=>render()); }
    else{
      const why=API.jsiFail ? (' · '+API.jsiFail) : (API.capFail ? (' · '+API.capFail) : (IS_APP ? ' · HTTP 探测失败' : ' · 未配置后端'));
      apiToast('本地后端未启动 · 词书不可用（15 秒后自动重试）'+why);
      render();
      setTimeout(bootWithRetry, 15000);
    }
  });
}
bootWithRetry();
