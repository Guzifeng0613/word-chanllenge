<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Noto Sans SC, sans-serif">
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e63"/><stop offset="1" stop-color="#0f3f44"/>
    </linearGradient>
    <linearGradient id="retainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#274a78"/>
    </linearGradient>
  </defs>

  <text x="40" y="42" font-size="26" font-weight="700" fill="#e8eef7">V2 心流与留存闭环：把 11 分钟的远征，变成停不下来的下一局</text>

  <!-- ============ 上半：战斗内即时心流 ============ -->
  <rect x="30" y="66" width="1140" height="330" rx="16" fill="#101828" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="52" y="100" font-size="18" font-weight="700" fill="#9fb6d8">战斗内 · 即时心流（Flow）</text>

  <!-- 答题起点 -->
  <rect x="500" y="120" width="200" height="56" rx="12" fill="#1a2740" stroke="#3a527a" stroke-width="1.5"/>
  <text x="600" y="146" font-size="17" fill="#e8eef7" text-anchor="middle">作答一道题</text>
  <text x="600" y="166" font-size="12" fill="#8fa3c4" text-anchor="middle">题干标注词性</text>

  <!-- 答对分支 -->
  <path d="M540 176 L250 210" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="300" y="196" font-size="14" fill="#34d399" text-anchor="middle">答对</text>
  <rect x="90" y="210" width="320" height="150" rx="12" fill="#0f2a20" stroke="#34d399" stroke-width="2"/>
  <text x="250" y="240" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">连击 +1（跨战斗累积）</text>
  <rect x="112" y="256" width="276" height="86" rx="10" fill="url(#flowGrad)" stroke="#2dd4bf" stroke-width="2"/>
  <text x="250" y="282" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">连击 ≥ 5 → 进入心流</text>
  <text x="250" y="304" font-size="12.5" fill="#bdf3ec" text-anchor="middle">青色光晕 · 心流横幅 · 连击发光</text>
  <text x="250" y="324" font-size="12.5" fill="#bdf3ec" text-anchor="middle">每答对额外 +1 词魂</text>

  <!-- 答错分支 -->
  <path d="M660 176 L950 210" fill="none" stroke="#f87171" stroke-width="2"/>
  <text x="900" y="196" font-size="14" fill="#f87171" text-anchor="middle">答错 / 超时</text>
  <rect x="790" y="210" width="320" height="150" rx="12" fill="#2a1418" stroke="#f87171" stroke-width="2"/>
  <text x="950" y="240" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle">心流中断 · 连击清零</text>
  <rect x="812" y="256" width="276" height="86" rx="10" fill="#241a33" stroke="#c084fc" stroke-width="2"/>
  <text x="950" y="282" font-size="16" font-weight="700" fill="#d8b4fe" text-anchor="middle">连错 ≥ 2 → 凝神</text>
  <text x="950" y="304" font-size="12.5" fill="#e6d4fb" text-anchor="middle">下一题限时 +2 秒</text>
  <text x="950" y="324" font-size="12.5" fill="#e6d4fb" text-anchor="middle">紫色横幅，仅本题生效</text>

  <!-- 微目标 -->
  <rect x="410" y="300" width="380" height="76" rx="12" fill="#2e2610" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="326" font-size="15" font-weight="700" fill="#fcd34d" text-anchor="middle">每场战斗 · 随机微目标</text>
  <text x="600" y="348" font-size="12.5" fill="#fde68a" text-anchor="middle">连击4 → +6HP　答对5题 → +6词魂　无错击败 → +10词魂</text>
  <text x="600" y="366" font-size="11.5" fill="#c9a84a" text-anchor="middle">把一局切成十几个几秒内可达成的小反馈</text>

  <!-- ============ 下半：局外留存闭环 ============ -->
  <rect x="30" y="420" width="1140" height="300" rx="16" fill="#101828" stroke="#2a3a55" stroke-width="1.5"/>
  <text x="52" y="454" font-size="18" font-weight="700" fill="#9fb6d8">局外 · 长期留存（账号 / 每日 / 打卡 / 成就）</text>

  <!-- 一局结束 -->
  <rect x="470" y="470" width="260" height="48" rx="12" fill="url(#retainGrad)" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="600" y="500" font-size="16" font-weight="700" fill="#e8eef7" text-anchor="middle">一局远征结束</text>

  <!-- 四个留存卡 -->
  <rect x="50" y="560" width="250" height="120" rx="12" fill="#16243c" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="175" y="590" font-size="15" font-weight="700" fill="#fcd34d" text-anchor="middle">词灵使等级（XP）</text>
  <text x="175" y="616" font-size="12.5" fill="#c6d4ec" text-anchor="middle">答对 +2 · 新学 +5 · 掌握 +10</text>
  <text x="175" y="638" font-size="12.5" fill="#c6d4ec" text-anchor="middle">升级需 120 × 等级</text>
  <text x="175" y="662" font-size="11.5" fill="#8fa3c4" text-anchor="middle">一局约 266–341 XP</text>

  <rect x="320" y="560" width="250" height="120" rx="12" fill="#16243c" stroke="#34d399" stroke-width="1.8"/>
  <text x="445" y="590" font-size="15" font-weight="700" fill="#6ee7b7" text-anchor="middle">每日目标</text>
  <text x="445" y="616" font-size="12.5" fill="#c6d4ec" text-anchor="middle">答对 40 题 · 新学 15 词</text>
  <text x="445" y="638" font-size="12.5" fill="#c6d4ec" text-anchor="middle">完成 1 次远征</text>
  <text x="445" y="662" font-size="11.5" fill="#8fa3c4" text-anchor="middle">零点重置，一局即完成</text>

  <rect x="590" y="560" width="250" height="120" rx="12" fill="#16243c" stroke="#fb923c" stroke-width="1.8"/>
  <text x="715" y="590" font-size="15" font-weight="700" fill="#fdba74" text-anchor="middle">连续打卡 Streak</text>
  <text x="715" y="620" font-size="20" fill="#fdba74" text-anchor="middle">🔥 连续天数</text>
  <text x="715" y="646" font-size="12.5" fill="#c6d4ec" text-anchor="middle">断一天即重置</text>
  <text x="715" y="668" font-size="11.5" fill="#8fa3c4" text-anchor="middle">3 / 7 天解锁成就</text>

  <rect x="860" y="560" width="290" height="120" rx="12" fill="#16243c" stroke="#c084fc" stroke-width="1.8"/>
  <text x="1005" y="590" font-size="15" font-weight="700" fill="#d8b4fe" text-anchor="middle">成就（12 项）</text>
  <text x="1005" y="616" font-size="12.5" fill="#c6d4ec" text-anchor="middle">战斗 · 连击 · 构筑</text>
  <text x="1005" y="638" font-size="12.5" fill="#c6d4ec" text-anchor="middle">掌握 · 打卡</text>
  <text x="1005" y="662" font-size="11.5" fill="#8fa3c4" text-anchor="middle">解锁顶部弹窗，首页成就墙</text>

  <!-- 连线：一局结束 → 四卡 -->
  <path d="M520 518 L175 552" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M560 518 L445 552" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M640 518 L715 552" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M680 518 L1005 552" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>

  <!-- 汇聚到再来一局 -->
  <rect x="430" y="752" width="340" height="60" rx="30" fill="#1c3a5e" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="600" y="789" font-size="20" font-weight="700" fill="#7dd3fc" text-anchor="middle">目标未尽 · 明天再来一局</text>
  <path d="M175 680 L175 730 L430 782" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M445 680 L445 740 L430 775" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M715 680 L715 740 L770 775" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>
  <path d="M1005 680 L1005 730 L770 782" fill="none" stroke="#4a6fa5" stroke-width="1.5"/>

  <!-- 闭环箭头回到作答 -->
  <path d="M430 782 L70 782 L70 148 L500 148" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 6"/>
  <polygon points="500,148 488,142 488,154" fill="#38bdf8"/>
</svg>
